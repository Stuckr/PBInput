<title>Sixes Spotter</title>
<style>
:root{font-family:Archivo,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#15181b;background:#e6e9eb;font-synthesis:none;--ink:#15181b;--muted:#5d666d;--line:#d9dee2;--green:#ffffff;--blue:#176189;--red:#af4d37}
*{box-sizing:border-box}body{margin:0}
button,input,select,textarea{font:inherit}
button,a,input,select{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;touch-action:manipulation;border:0}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #7b838a;outline-offset:3px}
button:disabled{opacity:.35;cursor:default}
a{color:inherit}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
select,input,textarea{font-size:16px!important}
.app{max-width:760px;min-height:100dvh;margin:auto;background:#f5f6f6;box-shadow:0 0 50px #23262808;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.match-grid{display:flex;flex-direction:column}.match-main,.match-side{display:contents}
.toolbar{order:1}.scoreboard{order:2}.clock-panel{order:3}.period-picker{order:4}.stage-label{order:5}.board{order:6}.summary{order:7}.feed{order:8}.match-footer{order:9;padding-top:6px}
.summary{padding:14px 20px 16px;border-top:1px solid var(--line);background:#f5f6f6}
.summary-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.summary-title h2{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin:0;font-weight:700}
.summary-title span{font-size:10px;letter-spacing:.5px;color:var(--muted)}
.summary-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.summary table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:max-content}
.summary th,.summary td{padding:6px 2px;text-align:center;border-top:1px solid var(--line)}
.summary thead th{border-top:0;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;line-height:1.2;vertical-align:bottom}
.summary tbody th{text-align:left;font-size:11px;color:#5f666c;position:sticky;left:0;background:#f5f6f6;padding-right:8px;z-index:1}
.summary td{white-space:nowrap}
.summary td b,.summary-title .key{display:inline-block;min-width:30px;padding:4px 6px;margin:0 2px;border-radius:6px;font-size:17px;font-weight:800;line-height:1.15;background:var(--c);color:var(--k);box-shadow:inset 0 0 0 1px #23262833}
.summary td b.zero{background:transparent;color:#8b9299;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.summary-title .key{font-size:10px;letter-spacing:.5px;min-width:0;padding:3px 7px}
.summary tbody th{font-size:13px!important;font-weight:800;color:var(--ink)!important}
.summary thead th{font-size:10px!important;color:#555b60!important}
.summary td.now,.summary thead th.now{background:#e1e3e5}
.summary td.total,.summary thead th.total{border-left:2px solid #a2a8ad}
.summary thead th.total,.summary thead th.now{color:var(--ink)!important;font-weight:800}

.game-no{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:11px;color:#656b71;font-weight:700}.game-no small{font-weight:400}.game-no input{width:120px;min-height:42px;border:1px solid #d6d8da;border-radius:7px;background:white;padding:8px 10px;color:var(--ink);text-align:center;font-weight:700}
.topbar{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;padding:4px;background:none;border:0;background:none;color:var(--ink);padding:0;text-align:left}
.brand b{font-weight:800}
.brand-logo{display:block;height:30px;width:auto}
.brand small{display:block;font-size:8px;letter-spacing:2px;color:var(--muted);margin-top:5px;font-weight:700}
.brand-mark{width:32px;height:36px;border:2px solid var(--ink);border-radius:8px 2px;display:grid;place-items:center;font-size:24px;font-weight:900;position:relative}
.brand-mark span{position:absolute;top:-9px;right:-6px;background:#f5f6f6;line-height:18px}
.local-status{font-size:10px;color:#595f65;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:10px}
.settings-btn{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 14px;border-radius:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;letter-spacing:.3px;flex-shrink:0;box-shadow:0 1px 3px #23262833}
.settings-btn svg{width:18px;height:18px;color:var(--green)}
.settings-btn:active{transform:scale(.97)}
.clock-manual{font-size:11px;font-weight:700;color:#7a5a16;background:#fff6dd;border:1px solid #e7d79a;border-radius:6px;padding:7px 11px}
/* Settings dialog */
.set-group{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.set-group:first-of-type{border-top:0;margin-top:10px}
.set-group h3{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.set-num{display:grid;gap:6px;font-size:12px;color:#585e64;font-weight:600}
.set-num input,.set-num select{min-height:46px;border:1px solid #d6d8da;border-radius:7px;background:white;padding:9px 11px;color:var(--ink);font-size:16px;font-weight:600}
.set-num small{font-weight:400;color:var(--muted);font-size:10.5px}
.set-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.set-toggle>span{font-size:13px;font-weight:600}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#edeeef}
.seg2 button{min-height:40px;padding:8px 14px;font-size:12px;font-weight:700;color:#5f666c;background:transparent;border:0}
.seg2 button.on{background:var(--ink);color:white}
.set-events{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.set-check{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid var(--line);border-radius:7px;background:#fafbfb;font-size:13px;font-weight:600;cursor:pointer}
.set-check input{width:19px;height:19px;flex-shrink:0;accent-color:var(--ink)}
.set-check small{margin-left:auto;font-size:10px;font-weight:700;color:#9ba1a7;letter-spacing:.5px}
.local-status i{display:inline-block;width:6px;height:6px;background:#668a4c;border-radius:50%;margin-right:4px}
.setup{padding:34px 24px}
.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--muted);font-weight:700;margin:0 0 12px}
.setup h1{font-size:36px;line-height:1.06;letter-spacing:-1.5px;margin:0 0 12px;font-weight:800}
.intro{font-size:14px;color:#666d73;line-height:1.5;max-width:380px}
.competition{display:flex;align-items:center;gap:10px;font-size:11px;padding:16px 0 22px;margin-top:16px;border-top:1px solid var(--line)}
.pill{background:var(--ink);color:white;border-radius:4px;padding:5px 6px;font-weight:700;font-size:10px}
.team-selectors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team-pick{border:1px solid var(--line);border-top:3px solid var(--team-color,var(--blue));border-radius:9px;background:white;padding:16px 12px;min-width:0}
.team-pick label{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.team-pick select{font-size:15px;font-weight:700;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0 0 10px;background:white;color:var(--ink);min-height:40px}
.goalie-default{font-size:11px;color:#666d73;margin:14px 0 0;line-height:1.4}
.color-label{font-size:10px;color:var(--muted);margin:16px 0 6px}
.roster-summary{font-size:11px;color:var(--muted);margin:14px 0 0;min-height:14px}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(28px,1fr));gap:3px;max-width:300px}
.swatch{min-width:28px;height:38px;padding:4px;border-radius:6px;border:2px solid transparent;background:transparent}
.swatch span{display:grid;place-items:center;width:100%;height:100%;min-height:26px;max-width:42px;margin:auto;background:var(--swatch);color:var(--swatch-ink);box-shadow:inset 0 0 0 1px #23262833;border-radius:50%;font-size:16px;font-weight:800}
.swatch.chosen{border-color:var(--ink)}
dialog .swatches{max-width:none;gap:8px}dialog .swatch{height:52px}dialog .swatch span{max-width:40px}
.primary{background:var(--ink);color:white;border-radius:7px;min-height:54px;padding:14px 20px;font-weight:700}
.start{width:100%;margin-top:20px;display:flex;justify-content:space-between;align-items:center}
.start span{color:var(--green);font-size:20px}
.setup-note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:20px}
.setup-note a{text-underline-offset:3px}
/* New-match data panel (styled after the Pointbench "Get data files" form) */
.datafield{margin-top:18px}
.datafield>label{display:block;font-size:12px;color:#5a6066;font-weight:600;margin-bottom:7px}
.datafield .row{display:flex;gap:10px;align-items:stretch}
.datafield select,.datafield input[type=text]{flex:1;min-width:0;min-height:46px;border:1px solid #cfd3d6;border-radius:9px;background:#fff;padding:10px 12px;color:var(--ink);font-size:15px;font-weight:600}
.datafield select:focus,.datafield input:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.datafield .hint{font-size:11px;color:var(--muted);margin:7px 0 0;line-height:1.4}
.datapanel .btn-ghost{min-height:46px;padding:0 16px;border:1px solid #cfd3d6;border-radius:9px;background:#fff;color:var(--ink);font-size:14px;font-weight:700;white-space:nowrap}
.datapanel .btn-ghost:disabled{opacity:.45}
.start-big{width:100%;margin-top:22px;min-height:54px;display:flex;justify-content:center;align-items:center;gap:10px;font-size:17px;font-weight:800}
.data-statusbar{margin-top:18px;border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.45;border:1px solid var(--line);background:#eef0f1;color:#4a5056}
.data-statusbar.ok{background:#e4f1e8;border-color:#bcdcc6;color:#1d5c37}
.data-statusbar.err{background:#f6e7e5;border-color:#e3c3bd;color:#8a3022}
.data-statusbar.busy{background:#eef2f6;border-color:#cdd7e0;color:#3a4654}
.game-meta{font-size:12px;color:#5a6066;margin:9px 0 0;line-height:1.5}
.game-meta b{color:var(--ink)}
.field-select{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 0}
.field-select>span{font-size:11px;color:#656b71;font-weight:700}
.field-buttons{display:flex;gap:7px}
.field-buttons button{min-height:42px;min-width:104px;padding:8px 14px;border:1px solid #d6d8da;border-radius:7px;background:#e6e8e9;color:#575d63;font-size:12px;font-weight:800}
.field-buttons button.selected{background:var(--ink);border-color:var(--ink);color:white}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:17px 20px 12px;gap:6px}
.toolbar-label{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;gap:5px}
.tool{background:transparent;border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-height:40px;font-size:12px;font-weight:700;color:var(--ink)}
.tool svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.scoreboard{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;margin:5px 20px 0;padding:18px 10px 20px;border-bottom:1px solid var(--line)}
.score-team{text-align:center;min-width:0}
.country-code{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--team-accent,var(--blue))}
.country-name{font-size:13px;margin-top:5px}
.kit-picker{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:32px;background:transparent;color:#676e74;font-size:10px;padding:4px;margin-top:5px}
.kit-picker i{height:12px;width:12px;border:1px solid #23262840;border-radius:50%}
.kit-picker span{font-size:13px}
.score{display:flex;justify-content:center;gap:8px;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.score span{color:#bbbfc3;font-weight:400}
.clock-panel{margin:13px 20px 0;padding:14px;border:1px solid var(--line);border-radius:10px;background:#edeeef}
.clock-panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.clock-panel-head>div:first-child{display:grid;gap:4px}
.clock-panel-head .eyebrow{font-size:8px;margin:0;letter-spacing:1px}
.clock-panel-head .field-select{margin:0}
.clock-panel-head .field-select>span{display:none}
.clock-panel-head .field-buttons button{min-width:76px;min-height:34px;padding:6px 9px;font-size:10px}
.clock-connection{font-size:10px}.clock-connection.live{color:#17683c}.clock-connection.stale{color:#87621a}
.clock-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.clock-read{min-height:38px;min-width:64px;padding:7px 12px;border-radius:6px;background:var(--ink);color:white;font-size:12px;font-weight:700}
.clock-values{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.clock-values>div{display:grid;gap:3px;justify-items:start}
.clock-values span{font-size:9px;color:#686f76}
.clock-values strong{font-size:27px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.clock-links{display:flex;gap:12px}
.clock-values button{background:none;padding:6px 0;font-size:10px;color:#5a6066;text-decoration:underline;min-height:28px}
.period-picker{margin:0 20px;padding:12px 0 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.period-picker>span{font-size:11px;color:#656b71}
.period-buttons{display:flex;gap:6px}
.period-buttons button{min-width:42px;min-height:38px;background:#e6e8e9;border:1px solid #d6d8da;border-radius:6px;color:#5f666c;font-weight:700;font-size:12px}
.period-buttons button.selected{color:var(--ink);background:var(--green);border-color:#828a91}
.period-buttons .add-ot{color:#555b60;background:#fff;border-style:dashed;min-width:48px}
.stage-label{padding:20px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.stage-label p{font-size:12px;margin:0;color:#656c72}
.stage-label b{color:var(--ink)}
.cancel{background:transparent;padding:6px 0 6px 8px;min-height:32px;font-size:12px;color:#646a70;text-decoration:underline}
.board{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:17px 20px 22px;min-height:245px}
.team-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-content:start}
.team-actions.inactive{opacity:.3}
.change-goalie{grid-column:1/-1;min-height:54px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:5px;padding:10px;border:1px solid var(--team-border);border-radius:7px;background:var(--team-soft);color:var(--team-accent);text-align:left}
.change-goalie span{font-size:12px;font-weight:700}
.change-goalie small{font-size:10px;line-height:1.35;overflow-wrap:anywhere}
.action{height:92px;border-radius:8px;background:var(--team-soft,#eceeef);color:var(--team-accent,var(--blue));border:1px solid var(--team-border,#dadcde);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:13px 12px;text-align:left}
.action strong{font-size:27px;letter-spacing:-1px;line-height:1}
.action small{font-size:10px;font-weight:600}
.action.goal{background:var(--team-color,var(--blue));color:var(--team-ink,white);border-color:var(--team-border,var(--blue))}
.action:active,.jersey:active{transform:scale(.97)}
.action.penalty{grid-column:1/-1;height:auto;min-height:58px;flex-direction:row;align-items:center}
.team-actions,.number-side{--tint:color-mix(in srgb,var(--team-color) 24%,#fff);--tint-line:color-mix(in srgb,var(--team-color) 40%,var(--team-border))}
.team-actions .action:not(.goal),.team-actions .change-goalie,.number-side .jersey{background:var(--team-soft);background:var(--tint);border-color:var(--team-border);border-color:var(--tint-line)}
.team-actions .change-goalie{background:color-mix(in srgb,var(--team-color) 12%,#fff)}
.action.penalty strong{font-size:17px;letter-spacing:-.3px}
.card-options{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.card-options button{min-height:48px;border-radius:6px;border:1px solid var(--line);background:white;color:var(--ink);font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;padding:8px 9px;text-align:left}
.card-options button.chosen{border:2px solid var(--ink);padding:7px 8px}
.card-options i,.card-chip{display:inline-block;width:11px;height:15px;border-radius:2px;box-shadow:inset 0 0 0 1px #23262840;flex-shrink:0}
.card-chip{margin-left:6px;vertical-align:-2px}
.time-input{width:100%;min-height:52px;border:1px solid #d6d8da;border-radius:8px;background:white;padding:10px 12px;color:var(--ink);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;text-align:center;margin-bottom:10px}
.confirm-time,.confirm-penalty{width:100%}
.offense-label{display:block;font-size:11px;color:#6d747a;margin:13px 0 6px}
.offense-select{width:100%;min-height:46px;border:1px solid #d6d8da;border-radius:6px;background:white;padding:10px;color:var(--ink);font-size:13px}
.confirm-penalty{width:100%;margin-top:10px;min-height:50px}
.number-side{min-width:0}
.number-head{font-size:10px;font-weight:700;color:var(--team-accent,var(--blue));letter-spacing:1px;display:flex;justify-content:space-between;margin-bottom:9px}
.jerseys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.jersey{height:46px;border:1px solid var(--team-border,#d7dadc);border-radius:6px;background:var(--team-soft,#eceeef);color:var(--team-accent,var(--blue));font-size:20px;font-weight:800;padding:0}
.waiting{color:#999fa5;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:8px;min-height:200px;font-size:11px}
.waiting span{font-size:22px}
.assist-options{display:grid;gap:10px}
.assist-options button{min-height:80px;border-radius:7px;font-size:23px;font-weight:800;background:var(--team-color,var(--blue));color:var(--team-ink,white);border:1px solid var(--team-border)}
.assist-options button.no{background:white;color:var(--ink);border:1px solid var(--line)}
.draft-details{font-size:12px;color:#646a70;padding-bottom:10px;line-height:1.5}
.feed{border-top:1px solid var(--line);padding:0 20px 16px;touch-action:pan-y;background:#eeefef}
.feed-handle{display:block;width:35px;height:4px;border-radius:3px;background:#c8cbce;margin:10px auto 12px}
.feed-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;gap:10px}
.feed-title h2{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin:0;font-weight:700}
.feed-title button{font-size:11px;color:#565c61;min-height:32px;background:transparent}

/* ---------- Pointbench data download ---------- */
// Tournament data sources on stats.pointbench.com. Each send-data URL returns a
// ZIP of the tournament's XML files (rosters, config, game list). These presets
// come from the user's downloads.json.
const PB_SOURCES = [
  { id: 'eslcm', label: "Men's Sixes", url: 'https://stats.pointbench.com/eu/eslcm/2026/index.php?cmd=send-data' },
  { id: 'eslcw', label: "Women's Sixes", url: 'https://stats.pointbench.com/eu/eslcw/2026/index.php?cmd=send-data' },
];
const DATA_KEY = 'lax-observer-rosterdata-v1';
// The full set of files from the most recent download/load, kept in memory for
// this session so games can be imported and the files saved to a folder.
let pbFiles = null;
// Period length/count for the loaded tournament, read from its config file.
let pbRules = { periodCount: 4, periodLength: 8, otLength: 3 };

// Minimal in-browser ZIP reader. Handles STORED (0) and DEFLATE (8) entries,
// using the browser's built-in DecompressionStream for deflate. Returns a map
// of { filename: text }. No external library needed.
async function readZip(buf) {
  const dv = new DataView(buf), bytes = new Uint8Array(buf), out = {};
  // Find the End Of Central Directory record (signature 0x06054b50), scanning back.
  let eocd = -1;
  for (let i = bytes.length - 22; i >= 0 && i >= bytes.length - 22 - 65536; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw Error('Not a valid ZIP file.');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true); // offset of first central-directory record
  const dec = new TextDecoder('utf-8');
  const inflate = async slice => {
    if (typeof DecompressionStream !== 'function') throw Error('This browser cannot unzip the data.');
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([slice]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  };
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break; // central-directory header
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = dec.decode(bytes.subarray(p + 46, p + 46 + nameLen));
    // Jump to the local file header to find where the data actually starts.
    const lNameLen = dv.getUint16(localOff + 26, true), lExtraLen = dv.getUint16(localOff + 28, true);
    const dataStart = localOff + 30 + lNameLen + lExtraLen;
    const comp = bytes.subarray(dataStart, dataStart + compSize);
    let raw;
    if (method === 0) raw = comp;
    else if (method === 8) raw = await inflate(comp);
    else { p += 46 + nameLen + extraLen + commentLen; continue; }
    out[name.split('/').pop()] = dec.decode(raw);
    p += 46 + nameLen + extraLen + commentLen;
  }
  return out;
}

// Build a fresh `data`-shaped object from the unzipped tournament files.
// Reads the master league file for the competition name and team order, then
// each per-team roster file for players (number, name, Pointbench id).
function parsePointbenchData(files, source) {
  const parser = new DOMParser();
  const parseXml = text => { const d = parser.parseFromString(text, 'application/xml'); if (d.querySelector('parsererror')) throw Error('Could not read a data file.'); return d; };
  const code = source.id;
  // The master file is the one with <league> at its root (e.g. 2026-eslcm.xml).
  const masterName = Object.keys(files).find(n => /<league[\s>]/.test(files[n]));
  let leagueName = source.label, teamOrder = null;
  if (masterName) {
    const L = parseXml(files[masterName]);
    leagueName = L.querySelector('league > name')?.textContent?.trim() || leagueName;
    const refs = [...L.querySelectorAll('teams > *')].map(el =>
      el.getAttribute('href') || el.getAttribute('id') || '');
    teamOrder = refs.map(r => (r.match(/roster-([a-z]{2,4})\.xml/i)?.[1] || r).toLowerCase()).filter(Boolean);
  }
  // Collect only the dedicated per-team roster files (…-roster-xx.xml). Game and
  // game-list files also contain <team id="…"> elements but no team <name> or
  // per-player names, so they must not be mistaken for rosters.
  const rosters = {};
  for (const [name, text] of Object.entries(files)) {
    if (!/roster-[a-z]{2,4}\.xml$/i.test(name)) continue;
    if (!/<team[\s>]/.test(text) || /<league[\s>]/.test(text)) continue;
    let doc; try { doc = parseXml(text); } catch { continue; }
    const teamEl = doc.querySelector('team'); if (!teamEl) continue;
    const id = (teamEl.getAttribute('id') || name.match(/roster-([a-z]{2,4})/i)?.[1] || '').toLowerCase();
    if (!id) continue;
    const teamName = teamEl.querySelector('name')?.textContent?.trim() || id.toUpperCase();
    const players = [...teamEl.querySelectorAll('player')].map(pl => {
      const no = pl.querySelector('no')?.textContent?.trim() ?? '';
      const last = pl.querySelector('last-name')?.textContent?.trim() ?? '';
      const first = pl.querySelector('first-name')?.textContent?.trim() ?? '';
      const full = pl.querySelector('full-name')?.textContent?.trim();
      const nm = full || [last, first].filter(Boolean).join(', ');
      return { number: no, name: nm, pid: pl.getAttribute('id') || '' };
    }).filter(p => p.number !== '');
    players.sort((a, b) => Number(a.number) - Number(b.number));
    if (players.length) rosters[id] = { id, name: teamName, players };
  }
  const ids = Object.keys(rosters);
  if (!ids.length) throw Error('No team rosters found in the download.');
  const ordered = (teamOrder && teamOrder.length ? teamOrder.filter(id => rosters[id]) : [])
    .concat(ids.filter(id => !teamOrder || !teamOrder.includes(id)));
  const teams = ordered.map(id => {
    const r = rosters[id];
    return { id, name: r.name, players: r.players.map(p => ({ number: p.number, name: p.name })), goalie: r.players[0] || null };
  });
  // Pointbench player ids for the XML export (team id -> jersey -> id).
  const pbIds = {};
  for (const id of ordered) { pbIds[id] = {}; for (const p of rosters[id].players) if (p.pid) pbIds[id][p.number] = p.pid; }
  // Period rules from the config file, so imported games split into the right periods.
  let rules = { periodCount: 4, periodLength: 8, otLength: 3 };
  const cfgName = Object.keys(files).find(n => /<config[\s>]/.test(files[n]));
  if (cfgName) { try {
    const C = parseXml(files[cfgName]);
    rules = {
      periodCount: Number(C.querySelector('period-count')?.textContent) || 4,
      periodLength: Number(C.querySelector('period-length')?.textContent) || 8,
      otLength: Number(C.querySelector('period-ot-length')?.textContent) || 3,
    };
  } catch {} }
  return {
    competition: `${leagueName}`,
    code,
    source: source.url,
    fetchedAt: new Date().toISOString(),
    teams,
    pbIds,
    rules,
  };
}

// Fetch, unzip and apply a source. Replaces the live rosters and the export id map.
async function loadPointbenchData(source) {
  const res = await fetch(source.url, { cache: 'no-store' });
  if (!res.ok) throw Error(`Download failed (HTTP ${res.status}).`);
  const buf = await res.arrayBuffer();
  const files = await readZip(buf);
  const fresh = parsePointbenchData(files, source);
  pbFiles = files; pbRules = fresh.rules || pbRules;
  applyRosterData(fresh);
  try { localStorage.setItem(DATA_KEY, JSON.stringify({ sourceId: source.id, data: fresh })); } catch {}
  return fresh;
}

// Swap the current rosters/competition/export-ids in and reset any setup picks
// that no longer match a team.
function applyRosterData(fresh) {
  data = { competition: fresh.competition, code: fresh.code, source: fresh.source, fetchedAt: fresh.fetchedAt, teams: fresh.teams };
  PB_IDS = fresh.pbIds || {};
  const valid = new Set(data.teams.map(t => t.id));
  setupPicks = setupPicks.map(id => valid.has(id) ? id : '');
  setupGoalies = setupPicks.map((id, i) => data.teams.find(t => t.id === id)?.goalie?.number || '');
}

// Load rosters from files the user picks: a Pointbench ZIP, or one or more of
// the unzipped XML files (rosters + optionally the master league file).
async function loadDataFromFiles(fileList) {
  const status = $('#data-status'); if (status) status.textContent = 'Reading file…';
  try {
    let files = {};
    for (const f of fileList) {
      if (/\.zip$/i.test(f.name)) Object.assign(files, await readZip(await f.arrayBuffer()));
      else if (/\.xml$/i.test(f.name)) files[f.name.split(/[\\/]/).pop()] = await f.text();
    }
    if (!Object.keys(files).length) throw Error('Choose a .zip or .xml file.');
    // Work out which competition this is: the chosen dropdown, else a filename code.
    const guess = Object.keys(files).join(' ').match(/\b(eslc[mw])\b/i)?.[1]?.toLowerCase();
    const src = PB_SOURCES.find(s => s.id === ($('#set-source')?.value || guess))
      || (guess && { id: guess, label: guess.toUpperCase(), url: '' })
      || PB_SOURCES.find(s => s.id === activeSourceId) || PB_SOURCES[0];
    const fresh = parsePointbenchData(files, src);
    pbFiles = files; pbRules = fresh.rules || pbRules;
    activeSourceId = src.id;
    applyRosterData(fresh);
    try { localStorage.setItem(DATA_KEY, JSON.stringify({ sourceId: src.id, data: fresh })); } catch {}
    notify(`Loaded ${fresh.teams.length} teams from file`);
    if (modal.open && $('#data-status')) showSettings();
    if (!match) renderSetup();
  } catch (err) {
    if ($('#data-status')) $('#data-status').textContent = 'Could not read file: ' + err.message;
    setupStatus = `err:Could not read file: ${esc(err.message)}`;
    if (!match && !modal.open) renderSetup();
    notify('Could not read file: ' + err.message);
  }
}

/* ---------- Save downloaded files to a chosen folder (desktop) ---------- */
// The File System Access API (desktop Chrome/Edge) lets us write the unzipped
// files into a folder the user picks, and remember that folder via IndexedDB.
const fsSupported = () => typeof window.showDirectoryPicker === 'function';
function idb() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open('lax-observer-fs', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('handles');
    r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error);
  });
}
async function idbGet(key) { try { const db = await idb(); return await new Promise((res, rej) => { const tx = db.transaction('handles', 'readonly').objectStore('handles').get(key); tx.onsuccess = () => res(tx.result); tx.onerror = () => rej(tx.error); }); } catch { return null; } }
async function idbSet(key, val) { try { const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction('handles', 'readwrite').objectStore('handles').put(val, key); tx.onsuccess = () => res(); tx.onerror = () => rej(tx.error); }); } catch {} }
async function ensurePermission(handle) {
  if (!handle) return false;
  const opts = { mode: 'readwrite' };
  if ((await handle.queryPermission?.(opts)) === 'granted') return true;
  return (await handle.requestPermission?.(opts)) === 'granted';
}
// Get the remembered folder (asking permission), or pick a new one.
async function getSaveFolder(forcePick = false) {
  if (!fsSupported()) throw Error('Saving to a folder needs desktop Chrome or Edge.');
  if (!forcePick) {
    const saved = await idbGet('saveDir');
    if (saved && await ensurePermission(saved)) return saved;
  }
  const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
  await idbSet('saveDir', dir);
  return dir;
}
// Write every file from the last download into the chosen folder.
async function saveFilesToFolder(forcePick = false) {
  if (!pbFiles || !Object.keys(pbFiles).length) throw Error('Download or load a tournament first.');
  const dir = await getSaveFolder(forcePick);
  let n = 0;
  for (const [name, text] of Object.entries(pbFiles)) {
    const fh = await dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable(); await w.write(text); await w.close(); n++;
  }
  try { localStorage.setItem('lax-observer-savedir-name', dir.name); } catch {}
  return { count: n, folder: dir.name };
}

/* ---------- Import games from the loaded tournament ---------- */
// Read the schedule (game-list) into rows: id, home/visiting ids, date, field, pool.
function parseGameList(files) {
  const listName = Object.keys(files).find(n => /<game-list[\s>]/.test(files[n]));
  if (!listName) return [];
  let doc; try { doc = new DOMParser().parseFromString(files[listName], 'application/xml'); } catch { return []; }
  return [...doc.querySelectorAll('game-list > game')].map(g => {
    const teams = [...g.querySelectorAll('team')];
    const home = teams.find(t => t.getAttribute('role') === 'home') || teams[0];
    const vis = teams.find(t => t.getAttribute('role') === 'visiting') || teams[1];
    const d = g.querySelector('date'), t = g.querySelector('time');
    const loc = (g.querySelector('location')?.textContent || '').trim();
    return {
      id: g.getAttribute('id') || '',
      home: home?.getAttribute('id') || '', visiting: vis?.getAttribute('id') || '',
      year: Number(d?.getAttribute('year')) || null, month: Number(d?.getAttribute('month')) || null, day: Number(d?.getAttribute('day')) || null,
      hour: Number(t?.getAttribute('hour')) || 0, min: Number(t?.getAttribute('min')) || 0,
      field: /2/.test(loc) ? '2' : /1/.test(loc) ? '1' : null,
      pool: (g.querySelector('description')?.textContent || '').trim(),
    };
  }).filter(g => g.id);
}
// Find the game XML file for a given game number within the loaded files.
function gameFileFor(files, id) {
  const n = String(id).padStart(3, '0');
  const name = Object.keys(files).find(k => new RegExp(`game-0*${id}\\.xml$`, 'i').test(k) || k.includes(`game-${n}.xml`));
  return name ? files[name] : null;
}
// Convert an absolute game time (minutes:seconds from the start of the match) to
// the app's { period, gameTime(countdown) } using the tournament's period length.
function splitGameTime(absSecs, rules) {
  const regLen = rules.periodLength * 60, otLen = rules.otLength * 60;
  let period = 1, start = 0;
  while (true) {
    const len = period <= rules.periodCount ? regLen : otLen;
    if (absSecs < start + len || period >= rules.periodCount + 4) break;
    start += len; period++;
  }
  const len = period <= rules.periodCount ? regLen : otLen;
  const remaining = Math.max(0, len - (absSecs - start));
  const mm = Math.floor(remaining / 60), ss = remaining % 60;
  return { period, gameTime: `${mm}:${String(ss).padStart(2, '0')}` };
}
// Build a match object from a PointBench game XML (the inverse of xmlFor).
function parseGameXml(text, rules, meta = {}) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror')) throw Error('Could not read the game file.');
  const gameEl = doc.querySelector('game'); if (!gameEl) throw Error('Not a game file.');
  const teamEls = [...doc.querySelectorAll('game > team')];
  if (teamEls.length < 2) throw Error('Game file has no teams.');
  const COLOR_IDS = ['blue', 'red'];
  const teams = teamEls.slice(0, 2).map((tEl, i) => {
    const id = (tEl.getAttribute('id') || '').toLowerCase();
    const known = (data.teams || []).find(t => t.id === id);
    const players = [...tEl.querySelectorAll(':scope > player')].map(pl => {
      const no = pl.querySelector('no')?.textContent?.trim() ?? '';
      const full = pl.querySelector('full-name')?.textContent?.trim()
        || [pl.querySelector('last-name')?.textContent, pl.querySelector('first-name')?.textContent].filter(Boolean).join(', ');
      return { number: no, name: full || `#${no}` };
    }).filter(p => p.number !== '');
    players.sort((a, b) => Number(a.number) - Number(b.number));
    return { id, name: known?.name || id.toUpperCase(), players, color: COLOR_IDS[i] };
  });
  const teamById = id => teams.find(t => t.id === id);
  const timeOf = el => { const tt = el.querySelector(':scope > time'); const abs = (Number(tt?.getAttribute('min')) || 0) * 60 + (Number(tt?.getAttribute('sec')) || 0); const at = tt?.getAttribute('ts') || null; return { abs, at, ...splitGameTime(abs, rules) }; };
  const clockFrom = (tm, field) => ({ field: field ?? null, gameTime: tm.gameTime, shotTime: null, status: 'imported', capturedAt: tm.at || null });
  const field = meta.field ?? null;
  const events = [], goalieLog = [], goalies = {};
  const evEls = [...doc.querySelectorAll('game > events > *')];
  for (let i = 0; i < evEls.length; i++) {
    const el = evEls[i], tag = el.tagName.toLowerCase(), teamId = el.getAttribute('team-id');
    const tm = timeOf(el), clock = clockFrom(tm, field);
    const pno = el.querySelector(':scope > p')?.getAttribute('no') || null;
    const mk = (action, extra = {}) => ({ id: crypto.randomUUID(), teamId, action, player: pno, period: tm.period, assist: null, save: null, penalty: null, clock, ...extra });
    if (tag === 'goalie-change') {
      const no = el.querySelector(':scope > p')?.getAttribute('no'); if (!no) continue;
      goalies[teamId] = no; goalieLog.push({ teamId, player: no, period: tm.period, clock: { ...clock, gameTime: tm.gameTime }, at: tm.at || null });
      continue;
    }
    if (tag === 'goal') {
      const s = el.querySelector(':scope > s')?.getAttribute('no') || null;
      const a = el.querySelector(':scope > a')?.getAttribute('no') || null;
      if (!s) continue;
      events.push(mk('G', { player: s, assist: a }));
    } else if (tag === 'shot') {
      const type = el.querySelector(':scope > type')?.textContent?.trim();
      if (type === 'S') {
        // A saved shot: the following <save> (same team-defending) carries the goalie.
        const next = evEls[i + 1];
        let save = null;
        if (next && next.tagName.toLowerCase() === 'save') {
          const sv = next, gkTeam = sv.getAttribute('team-id'), gk = sv.querySelector(':scope > p')?.getAttribute('no') || null;
          save = { teamId: gkTeam, player: gk };
          i++; // consume the save element
        }
        if (!pno) continue; // the app requires a shooter
        if (!save) save = { teamId: teams.find(t => t.id !== teamId)?.id, player: null };
        events.push(mk('SS', { save }));
      } else { // 'W' = wide
        if (!pno) continue;
        events.push(mk('SW'));
      }
    } else if (tag === 'save') {
      // A save not preceded by its shot (shooter unknown): record as the opponent's saved shot.
      const shooterTeam = teams.find(t => t.id !== teamId)?.id;
      events.push({ id: crypto.randomUUID(), teamId: shooterTeam, action: 'SS', player: null, period: tm.period, assist: null, save: { teamId, player: el.querySelector(':scope > p')?.getAttribute('no') || null }, penalty: null, clock });
    } else if (tag === 'ground-ball') { if (pno) events.push(mk('GB'));
    } else if (tag === 'turnover') { if (pno) events.push(mk('TO'));
    } else if (tag === 'caused-turnover') { if (pno) events.push(mk('CT'));
    } else if (tag === 'fo') { if (pno) events.push(mk('FO'));
    } else if (tag === 'free-position') { if (pno) events.push(mk('FP'));
    } else if (tag === 'card') {
      if (!pno) continue;
      const offense = el.querySelector(':scope > description')?.textContent?.trim() || 'Other';
      const color = { G: 'green', Y: 'yellow', R: 'red' }[el.querySelector(':scope > color')?.textContent?.trim()] || null;
      const pt = el.querySelector(':scope > penalty-time')?.textContent?.trim() || null;
      events.push(mk('PEN', { penalty: { offense, card: color, time: pt } }));
    } else if (tag === 'timeout') { events.push(mk('TMO', { player: null }));
    }
    // anything else: skipped (no app equivalent).
  }
  // Drop any saved-shot whose save references a player, keeping shooter-less ones only if they have a save player.
  const cleaned = events.filter(e => e.player != null || (e.action === 'SS' && e.save?.player != null));
  // Starting goalies: first goalie-change per team, else none.
  const dEl = gameEl.querySelector(':scope > date'), hEl = gameEl.querySelector(':scope > time');
  const date = meta.year ? new Date(meta.year, (meta.month || 1) - 1, meta.day || 1, meta.hour || 0, meta.min || 0)
    : dEl ? new Date(Number(dEl.getAttribute('year')), (Number(dEl.getAttribute('month')) || 1) - 1, Number(dEl.getAttribute('day')) || 1, Number(hEl?.getAttribute('hour')) || 0, Number(hEl?.getAttribute('min')) || 0)
    : new Date();
  const lastPeriod = cleaned.reduce((m, e) => Math.max(m, e.period || 1), 1);
  return {
    id: crypto.randomUUID(),
    date: date.toISOString(),
    field,
    teams,
    goalies,
    goalieLog,
    currentPeriod: lastPeriod,
    events: cleaned,
    undo: [],
    gameNo: meta.id ? String(Number(meta.id)) : (gameEl.getAttribute('id') || null),
    imported: true,
  };
}

  else if (!playit.state.connected) { label = 'Offline'; cls = 'stale'; }
  else if (confirmed) { label = 'Connected'; cls = 'live'; }
  else { label = 'Last known'; cls = 'stale'; }
  statusEl.textContent = label; statusEl.className = 'clock-connection ' + cls;
  const g = $('#game-clock'), s = $('#shot-clock'), gs = $('#pl-gamestatus'), ss = $('#pl-shotstatus');
  if (g && score && score.clock) g.textContent = score.clock;
  if (s && shot && shot.clock) s.textContent = shot.clock;
  if (gs) gs.textContent = !score ? (suffix == null ? 'Pick a field' : live && !mapped ? 'Field map not loaded — tap Read' : 'Waiting for a reading')
    : `${score.period != null ? 'Q' + score.period + ' · ' : ''}${confirmed ? (score.motion === 'stopped' ? 'Live · stopped' : 'Live') : 'Last known'}${score.home != null ? ` · ${score.home}–${score.guest}` : ''}`;
  if (ss) ss.textContent = shot ? (confirmed ? 'Live' : 'Last known') : '';
}

const hexMix = (a, b, w) => '#' + [1, 3, 5].map(i => Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - w) + parseInt(b.slice(i, i + 2), 16) * w).toString(16).padStart(2, '0')).join('');

function eventRow(e, index) {

  };
  const shooting = team(e.teamId), shooter = shooting?.players.find(p => p.number === e.player);

  const defending = match.teams.find(t => e.save ? t.id === e.save.teamId : t.id !== e.teamId), goalie = defending?.players.find(p => p.number === e.save?.player);

function teamHeading(t, side) {

}
/* ---------- Active penalties (live countdown under the game clock) ---------- */
// Each entry: { id (source event id), teamId, player, card, remainingMs }.
// Added when a penalty with a time is recorded; counted down with the game clock.
function reconcilePenalties() {
  if (!match) return;
  match.penalties = (match.penalties || []).filter(p => match.events.some(e => e.id === p.id && e.action === 'PEN'));
}
function penChips() {
  const list = (match?.penalties || []).filter(p => p.remainingMs > 0);
  if (!list.length) return '';
  return list.map(p => {
    const t = team(p.teamId), pal = teamPalette(t, match.teams.indexOf(t));
    const s = Math.ceil(p.remainingMs / 1000), mm = Math.floor(s / 60), ss = s % 60;
    return `<button class="pen-chip" data-do="clear-pen" data-id="${esc(p.id)}" style="--pc:${pal.hex};--pk:${pal.ink}" title="Tap to clear (e.g. penalty served or goal scored)" aria-label="Penalty ${esc(t?.id?.toUpperCase() ?? '')} number ${esc(p.player ?? '')}, ${mm}:${String(ss).padStart(2, '0')} remaining. Tap to clear."><i class="pen-card" style="background:${p.card ? CARDS[p.card].hex : 'transparent'}"></i><span class="pen-num">${esc(t?.id?.toUpperCase() ?? '')}${p.player != null ? ' #' + esc(p.player) : ''}</span><span class="pen-time">${mm}:${String(ss).padStart(2, '0')}</span></button>`;
  }).join('');
}
const penStrip = () => `<div class="pen-strip" id="pen-strip">${penChips()}</div>`;
function paintPenalties() { const el = $('#pen-strip'); if (el) el.innerHTML = penChips(); }

/* ---------- Combined feed: the last 15 events of the whole game ---------- */
function spineFeed() {
  const rows = match.events.map((e, i) => ({ e, i })).slice(-15).reverse();
  const header = `<div class="feed-title"><h2>Last 15 events</h2><button data-do="history">All ${match.events.length}</button></div>`;
  if (!rows.length) return `<div class="spine-feed">${header}<p class="spine-feed-empty">No actions yet</p></div>`;
  const body = rows.map(({ e, i }) => {
    const t = team(e.teamId), pal = teamPalette(t, match.teams.indexOf(t));
    const p = t?.players.find(p => p.number === e.player);
    const detail = e.action === 'G' ? (e.assist !== null ? `Assist #${e.assist}` : 'No assist')
      : e.action === 'PEN' ? penaltyText(e.penalty)
      : e.action === 'TMO' ? 'Team timeout'
      : (p?.name ?? '');
    const label = ACTIONS[e.action] || catalogByCode(e.action)?.label || e.action;
    return `<button class="feed-row" data-do="edit" data-id="${esc(e.id)}" aria-label="Edit action ${i + 1}, ${esc(label)}"><span class="fr-ix">${String(i + 1).padStart(2, '0')}<small>${periodLabel(e.period, '—')}</small></span><span class="fr-code" style="color:${pal.accent};border-bottom:2px solid ${pal.hex}">${esc(t?.id?.toUpperCase() ?? '—')}</span><span class="fr-act">${esc(label)}${CARDS[e.penalty?.card] ? `<i class="card-chip" style="background:${CARDS[e.penalty.card].hex}"></i>` : ''}${detail ? `<small>${esc(detail)}</small>` : ''}</span><span class="fr-num">${e.player == null ? '' : '#' + esc(e.player)}</span></button>`;
  }).join('');
  return `<div class="spine-feed">${header}<div class="spine-feed-list">${body}</div></div>`;
}

function renderMatch() {
  reconcilePenalties();
  const [a, b] = match.teams, n = match.events.length;
  const clockHtml = `<section class="clock-panel" id="clock-panel">${clockPanel()}</section>`;
  let hint = !match.field ? 'Choose Field 1 or Field 2 before recording actions' : 'Select an action';
  if (draft) hint = draft.stage === 'game-time' ? 'Type the game clock, e.g. 0734 = 07:34, then save' : draft.stage === 'assist-choice' ? 'Confirm the assist' : draft.stage === 'assist-player' ? 'Select the assisting player' : draft.stage === 'penalty' ? 'Card, offense and time' : draft.action === 'SS' ? 'Select the shooter' : 'Select the player';

  const half = (t, side) => { const c = teamPalette(t, side); return `<section class="half side-${side}" style="${paletteStyle(t, side)}" aria-label="${esc(t.name)}"><header class="half-head"><div class="half-team"><div class="country-code">${esc(t.id.toUpperCase())}</div><div class="country-name">${esc(t.name)}</div><button class="kit-picker" data-do="choose-color" data-side="${side}" aria-label="${esc(t.name)} jersey colour: ${c.name}"><i style="background:${c.hex}"></i>${c.name}<span>⌄</span></button></div><div class="half-score" aria-label="${esc(t.name)} score ${score(t.id)}">${score(t.id)}</div></header><div class="half-body">${draft ? numberSide(t, side) : actionButtons(t, side)}</div></section>`; };
  // Full-width top bar: logo, game/shot clock (with any penalty times under the game clock), and the period picker.
  const bar = `<header class="matchbar" aria-label="Game clock, period and penalties"><button class="brand bar-brand" data-do="home" aria-label="PointBench">${$('.topbar .brand-logo')?.outerHTML ?? ''}</button><div class="bar-clock">${clockHtml}</div><div class="bar-period">${periodButtons()}</div></header>`;
  // Centre column: the stage hint, the whole-game event feed (last 15), then the tools.
  const spine = `<aside class="spine" aria-label="Events and tools"><div class="stage-label"><p>${draft ? `<b>${esc(ACTIONS[draft.action] || catalogByCode(draft.action)?.label || draft.action)}</b> · ` : ''}${hint}</p>${draft ? '<button class="cancel" data-do="cancel">Cancel</button>' : ''}</div>${spineFeed()}<div class="spine-tools"><button class="tool" data-do="summary">Summary</button><div class="tool-row"><button class="tool" data-do="export" aria-label="Export PDF">PDF</button><button class="tool" data-do="export-csv" aria-label="Export CSV">CSV</button><button class="tool" data-do="export-xml" aria-label="Export XML">XML</button></div><button class="tool" data-do="rosters">Roster</button><button class="tool" data-do="settings">Settings</button><button class="tool full" data-do="new">New match</button></div><span class="local-status save-status">${statusHtml}</span></aside>`;
  document.body.classList.add('in-match');
  main.innerHTML = `<div class="split">${bar}${half(a, 0)}${spine}${half(b, 1)}</div>`;
  syncPlayit(); paintPlayit(); paintPenalties();
}
// After the player (and, in manual mode, the game time) are set, go to the
// action-specific sub-step or commit.
function afterPlayer() {
  if (draft.action === 'G') { draft.stage = 'assist-choice'; renderMatch(); }
  else if (draft.action === 'PEN') { draft.stage = 'penalty'; draft.card = null; draft.offense = ''; draft.penTime = ''; renderMatch(); }
  else finalize();
}
// The last gate before an event is saved. In manual timing the game clock is
// asked here — always the final input, after player, assist, card, etc.
function finalize() {
  if (settings.autoClock) return commitDraft();
  // Manual timing: only goals and penalties ask for the game clock.
  if (!TIMED_ACTIONS.includes(draft.action)) { draft.clock = { ...draft.clock, gameTime: null, status: 'untimed', orderTime: orderTime(draft.period) }; return commitDraft(); }
  draft.stage = 'game-time'; draft.timeText = match.lastTime?.text ?? ''; renderMatch();
  setTimeout(() => { const i = $('#draft-gametime'); i?.focus(); i?.select(); }, 30);
}
function commitDraft() {
  try {
    if (!match.field) throw Error('Choose Field 1 or Field 2 before recording an action.');
    const ev = validateEvent({ id: crypto.randomUUID(), teamId: draft.teamId, action: draft.action, player: draft.player, period: draft.period, assist: draft.assist ?? null, save: draft.action === 'SS' ? draft.save : null, penalty: draft.action === 'PEN' ? { offense: draft.offense, card: draft.card ?? null, time: draft.penTime || null } : null, clock: draft.clock }, match.teams);
    match = applyChange(match, [...match.events, ev]);
    // Start a live countdown for a timed penalty.
    if (ev.action === 'PEN' && ev.penalty?.time) { const ms = parseGame(ev.penalty.time); if (ms) (match.penalties ||= []).push({ id: ev.id, teamId: ev.teamId, player: ev.player, card: ev.penalty.card ?? null, remainingMs: ms }); }
    draft = null; persist(); renderMatch();
  } catch (err) { notify(err.message); }
}
function undo() {
  if (draft) { draft = null; renderMatch(); notify('Current entry cancelled'); return; }
  if (!match.undo?.length) return;
  match = undoChange(match); persist(); renderMatch(); notify('Last change undone');
}

/* ---------- Summary: counts per quarter under each category ---------- */
function summaryHtml() {
  const codes = Object.keys(ACTIONS), ids = match.teams.map(t => t.id), pal = match.teams.map((t, i) => teamPalette(t, i));
  const periods = Array.from({ length: periodsInPlay() }, (_, i) => i + 1);
  const count = (q, code, id) => match.events.filter(e => e.action === code && e.teamId === id && (q == null || e.period === q)).length;
  const cell = (q, code) => ids.map((id, i) => { const n = count(q, code, id); return `<b class="${n ? '' : 'zero'}" style="--c:${pal[i].hex};--k:${pal[i].ink};--a:${pal[i].accent}">${n}</b>`; }).join('');
  // Rows are categories; columns are each period plus a Total.
  const bodyRow = code => `<tr><th scope="row">${ACTIONS[code]}</th>${periods.map(q => `<td class="${currentPeriod() === q ? 'now' : ''}">${cell(q, code)}</td>`).join('')}<td class="total">${cell(null, code)}</td></tr>`;
  return `<section class="summary" aria-label="Summary by period"><div class="summary-title"><h2>Summary</h2><span>${match.teams.map((t, i) => `<b class="key" style="--c:${pal[i].hex};--k:${pal[i].ink}">${esc(t.id.toUpperCase())}</b>`).join('')}</span></div><div class="summary-scroll"><table><thead><tr><th></th>${periods.map(q => `<th scope="col" class="${currentPeriod() === q ? 'now' : ''}">${periodLabel(q)}</th>`).join('')}<th scope="col" class="total">Total</th></tr></thead><tbody>${codes.map(bodyRow).join('')}</tbody></table></div></section>`;
}

const standalone = !window.claude;
async function nativeSave(filename, fileData, type, label) {
  const file = new File([fileData], filename, { type });
  try {
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return; }
  } catch (err) { if (err?.name === 'AbortError') return; }
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000); notify(`${label} export downloaded`);
}
const MIME = { PDF: 'application/pdf', CSV: 'text/csv', XML: 'application/xml' };
async function saveFile(filename, fileData, label, textFallback) {
  if (standalone) return nativeSave(filename, fileData, MIME[label], label);
  if (downloads) {
    try { await downloads.save({ filename, data: fileData }); notify(`${label} export saved`); return; }
    catch (err) { if (err?.code === 'declined') return; if (err?.code === 'rate_limited') { notify('A save is already waiting. Try again in a moment.'); return; } }
  }
  if (textFallback != null) showExportText(`${label} export`, textFallback);
  else notify(`${label} export is unavailable in this view. Use CSV instead.`);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-do]'); if (!b || b.disabled) return;
  const act = b.dataset.do;
  switch (act) {
    case 'close': closeModal(); break;
    case 'home': if (!match) renderSetup(); break;
    case 'setup-field': setupField = b.dataset.field; renderSetup(); break;
    case 'field': match.field = b.dataset.field; persist(); renderMatch(); break;
    case 'clock-toggle': clock.running = !clock.running; clock.at = Date.now(); persist(); $('#clock-panel').innerHTML = clockPanel(); break;
    case 'clock-reset-game': clock.game = startGame(currentPeriod()); clock.shot = SHOT_MS(); clock.running = false; persist(); $('#clock-panel').innerHTML = clockPanel(); break;
    case 'clock-set-game': { const v = prompt('Game clock remaining (m:ss or seconds):', fmtGame(clock.game)); if (v != null) { const ms = parseGame(v); if (ms == null) notify('Enter a time like 6:30 or 390.'); else { clock.game = ms; clock.running = false; persist(); $('#clock-panel').innerHTML = clockPanel(); } } break; }
    case 'clock-set-shot': { const v = prompt('Shot clock remaining (seconds):', fmtShot(clock.shot)); if (v != null) { const n = Number(v); if (!Number.isFinite(n) || n < 0) notify('Enter a number of seconds.'); else { clock.shot = Math.round(n) * 1000; clock.at = Date.now(); persist(); $('#clock-panel').innerHTML = clockPanel(); } } break; }
    case 'clock-reset-shot': clock.shot = SHOT_MS(); clock.at = Date.now(); persist(); paintClock(); break;
    case 'read-clock': {
      if (settings.playit && settings.playit !== 'off') {
        if (playit.stop) { try { playit.stop(); } catch {} playit.stop = null; }
        playit.mode = 'off'; // force syncPlayit to open a fresh connection
        syncPlayit();
        if (settings.playit === 'live') fetchPlayitMap().then(() => paintPlayit());
        notify('Reconnecting to Playit…');
      }
      break;
    }
    case 'color': {
      const i = Number(b.dataset.side), color = b.dataset.color;
      if (b.dataset.scope === 'setup') { setupColors[i] = color; renderSetup(); }
      else { match.teams[i].color = color; persist(); closeModal(); renderMatch(); }
      break;
    }
    case 'choose-color': { const i = Number(b.dataset.side), t = match.teams[i]; showModal(`${head('Jersey colour')}<p class="dialog-note">${esc(t.name)}</p>${swatches(teamPalette(t, i).id, i, 'match')}`); break; }
    case 'period': if (!draft) { match.currentPeriod = Number(b.dataset.period); if (!clock.running && clockEnded()) { clock.game = startGame(currentPeriod()); clock.shot = SHOT_MS(); } persist(); renderMatch(); } break;
    case 'add-ot': if (!draft) { match.currentPeriod = Math.min(maxPeriod(), periodsInPlay() + 1); clock.game = startGame(currentPeriod()); clock.shot = SHOT_MS(); clock.running = false; persist(); renderMatch(); } break;
    case 'start': {
      const g = gameListCache.find(x => String(x.id) === String(setupGameId));
      if (!g) { notify('Pick a game first.'); return; }
      try {
        // If this game is already in the archive, resume that copy (keeps any
        // live edits) rather than re-parsing over it.
        const sameIds = m => m.teams.map(t => t.id).sort().join();
        const already = db.matches.find(m => m.imported && String(m.gameNo) === String(Number(g.id)) && sameIds(m) === [g.home, g.visiting].sort().join());
        if (already) {
          match = already; db.activeId = match.id;
        } else if (gameFileFor(pbFiles, g.id)) {
          // Game has data — import it and open to review/continue.
          match = importOneGame(pbFiles, pbRules, g);
          db.activeId = match.id;
        } else {
          // Not played yet — start a fresh live match with the scheduled teams.
          match = freshMatchFromSchedule(g);
          db.matches.push(match); db.activeId = match.id;
        }
        setupGameId = ''; draft = null; loadClock(); persist(); renderMatch();
      } catch (err) { notify('Could not start: ' + err.message); }
      break;
    }
    case 'start-manual': {
      const [a, c] = setupPicks;
      if (!a || !c || a === c || !setupField) { notify('Pick two different teams and a field.'); return; }
      try {
        match = {
          id: crypto.randomUUID(), date: new Date().toISOString(), field: setupField,
          teams: [a, c].map((id, i) => ({ ...structuredClone(data.teams.find(t => t.id === id)), color: setupColors[i] })),
          goalies: { [a]: setupGoalies[0] || null, [c]: setupGoalies[1] || null },
          currentPeriod: 1, events: [], undo: [],
          gameNo: /^\d+$/.test(setupGameNo.trim()) ? String(Number(setupGameNo.trim())) : null,
        };
        match.goalieLog = match.teams.filter(t => match.goalies[t.id]).map(t => ({ teamId: t.id, player: match.goalies[t.id], period: 1, clock: null, at: match.date }));
        db.matches.push(match); db.activeId = match.id;
        setupGameId = ''; draft = null; loadClock(); persist(); renderMatch();
      } catch (err) { notify('Could not start: ' + err.message); }
      break;
    }
    case 'setup-download': {
      const sel = $('#setup-source'), src = PB_SOURCES.find(s => s.id === sel?.value) || PB_SOURCES[0];
      activeSourceId = src.id; setupStatus = `busy:Downloading ${esc(src.label)}…`; renderSetup();
      loadPointbenchData(src).then(fresh => {
        setupStatus = `ok:Loaded ${fresh.teams.length} teams and ${Object.keys(pbFiles).length} files for ${esc(fresh.competition)}. Pick a game to start.`;
        renderSetup();
      }).catch(err => { setupStatus = `err:Download failed: ${esc(err.message)} · try “Load file” with the ZIP from your Pointbench downloader.`; renderSetup(); });
      break;
    }
    case 'setup-loadfile': $('#setup-file-input')?.click(); break;
    case 'archives': showArchives(); break;
    case 'settings': settingsDraft = { ...settings, enabled: [...settings.enabled] }; showSettings(); break;
    case 'set-flag': { readSettingNumbers(); settingsDraft[b.dataset.flag] = b.dataset.val === '1'; showSettings(); break; }
    case 'set-playit': { readSettingNumbers(); settingsDraft.playit = b.dataset.val; showSettings(); break; }
    case 'download-data': {
      const sel = $('#set-source'), src = PB_SOURCES.find(s => s.id === sel?.value) || PB_SOURCES[0];
      activeSourceId = src.id;
      const status = $('#data-status'); if (status) status.textContent = `Downloading ${src.label}…`;
      b.disabled = true;
      loadPointbenchData(src).then(fresh => {
        notify(`Loaded ${fresh.teams.length} teams from Pointbench`);
        if (modal.open && $('#data-status')) showSettings(); // refresh the dropdown + summary
        if (!match) renderSetup();
      }).catch(err => {
        b.disabled = false;
        if ($('#data-status')) $('#data-status').textContent = 'Download failed: ' + err.message + ' · try “Load from file”.';
        notify('Could not load Pointbench data: ' + err.message);
      });
      break;
    }
    case 'pick-data-file': $('#data-file-input')?.click(); break;
    case 'save-folder': case 'change-folder': {
      b.disabled = true;
      saveFilesToFolder(act === 'change-folder').then(r => {
        notify(`Saved ${r.count} files to “${r.folder}”`);
        if (modal.open) showSettings();
      }).catch(err => { b.disabled = false; if (err?.name !== 'AbortError') notify('Could not save files: ' + err.message); });
      break;
    }
    case 'import-games': showImportGames(); break;
    case 'import-game-one': {
      try {
        const meta = gameListCache.find(g => String(g.id) === b.dataset.id);
        const m = importOneGame(pbFiles, pbRules, meta);
        persist(); notify(`Imported game ${meta.id}: ${m.teams.map(t => t.name).join(' — ')}`);
        showImportGames();
      } catch (err) { notify('Import failed: ' + err.message); }
      break;
    }
    case 'import-games-all': {
      let ok = 0, fail = 0;
      for (const meta of gameListCache) { try { if (gameFileFor(pbFiles, meta.id)) { importOneGame(pbFiles, pbRules, meta); ok++; } } catch { fail++; } }
      persist(); notify(`Imported ${ok} game${ok === 1 ? '' : 's'}${fail ? `, ${fail} skipped` : ''}`);
      closeModal(); if (!match) renderSetup();
      break;
    }
    case 'save-settings': {
      readSettingNumbers();
      if (!settingsDraft.enabled.length) { notify('Keep at least one event type.'); return; }
      settingsDraft.enabled = ACTION_CATALOG.filter(a => settingsDraft.enabled.includes(a.code)).map(a => a.code);
      settings = settingsDraft; settingsDraft = null; saveSettings();
      closeModal();
      if (!match) renderSetup(); else renderMatch();
      syncPlayit();
      notify('Settings saved');
      break;
    }
    case 'resume': match = db.matches.find(m => m.id === b.dataset.id); draft = null; loadClock(); persist(); closeModal(); renderMatch(); break;
    case 'action': {
      if (!match.field) { notify('Choose Field 1 or Field 2 first.'); return; }
      const teamId = b.dataset.team, code = b.dataset.action;
      // A timeout has no player: record it straight away (auto timing) or ask only for the game clock (manual).
      if (code === 'TMO') {
        if (settings.autoClock) { draft = { teamId, action: 'TMO', player: null, period: currentPeriod(), clock: captureClock(), assist: null, save: null }; commitDraft(); notify(`${team(teamId)?.name ?? ''} · Timeout`); }
        else { draft = { teamId, action: 'TMO', stage: 'game-time', player: null, period: currentPeriod(), clock: captureClock(), assist: null, save: null, timeText: match.lastTime?.text ?? '' }; renderMatch(); setTimeout(() => { const i = $('#draft-gametime'); i?.focus(); i?.select(); }, 30); }
        return;
      }
      draft = { teamId, action: code, stage: 'player', player: null, period: currentPeriod(), clock: captureClock(), save: code === 'SS' ? saveForShot(match, teamId) : null };
      renderMatch(); break;
    }
    case 'number':
      if (draft.stage === 'assist-player') { draft.assist = b.dataset.number; finalize(); return; }
      draft.player = b.dataset.number;
      afterPlayer();
      break;
    case 'time-confirm': {
      const typed = parseClockEntry($('#draft-gametime')?.value);
      if (!typed) { notify(TIME_HELP); return; }
      draft.timeText = typed;
      draft.clock = { ...draft.clock, gameTime: typed };
      rememberTime(typed, draft.period);
      commitDraft();
      break;
    }
    case 'assist-yes': draft.stage = 'assist-player'; renderMatch(); break;
    case 'assist-no': draft.assist = null; finalize(); break;
    case 'penalty-card': draft.card = b.dataset.card || null; renderMatch(); break;
    case 'penalty-confirm': {
      if (!draft.offense) { notify('Choose the offense.'); return; }
      const raw = ($('#draft-pentime')?.value || '').trim();
      if (raw) { const ms = parseGame(raw); if (ms == null) { notify('Penalty time looks like MM:SS, e.g. 1:00.'); return; } draft.penTime = fmtGame(ms); } else draft.penTime = '';
      finalize();
      break;
    }
    case 'cancel': draft = null; renderMatch(); break;
    case 'clear-pen': { match.penalties = (match.penalties || []).filter(p => p.id !== b.dataset.id); persist(); paintPenalties(); break; }
    case 'undo': undo(); break;
    case 'history': showHistory(); break;
    case 'summary': showModal(`${head('Summary by period')}${summaryHtml()}<div class="dialog-actions"><button class="secondary" data-do="close">Back to match</button></div>`); break;
    case 'edit': showEdit(b.dataset.id); break;
    case 'export': exportPdf(); break;
    case 'export-csv': exportCsv(); break;
    case 'export-xml': exportXml(); break;
    case 'copy-export': {
      const ta = $('#export-text'), fail = () => { ta.focus(); ta.select(); notify('Select and copy the text'); };
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(ta.value).then(() => notify('Copied'), fail); else fail();
      break;
    }
    case 'delete': match = applyChange(match, match.events.filter(x => x.id !== b.dataset.id)); persist(); closeModal(); renderMatch(); notify('Action deleted · tap Undo to restore it'); break;
    case 'change-goalie': showQuickGoalie(b.dataset.team); break;
    case 'save-quick-goalie': {
      const t = match.teams.find(t => t.id === b.dataset.team), number = $('#quick-goalie').value;
      const typed = readGoalieTime(number); if (typed === false) return;
      setGoalie(t.id, number, typed); persist(); closeModal(); renderMatch();
      notify(number ? `${t.name} · Goalkeeper #${number}` : `${t.name} · No active goalkeeper`); break;
    }
    case 'rosters': showRosters(); break;
    case 'save-goalie': {
      const teamId = $('#roster-team').value, goalie = $('#roster-goalie').value, t = team(teamId);
      const typed = readGoalieTime(goalie); if (typed === false) return;
      setGoalie(teamId, goalie, typed); persist(); closeModal(); renderMatch();
      notify(goalie ? `Goalkeeper #${goalie} set for ${t.name}` : `Active goalkeeper cleared for ${t.name}`); break;
    }
    case 'save-player': {
      const t = team($('#roster-team').value), n = $('#roster-number').value.trim(), name = $('#roster-name').value.trim();
      if (!/^\d{1,3}$/.test(n) || !name) { $('#roster-error').textContent = 'Enter a jersey number (0–999) and a player name.'; return; }
      const num = String(Number(n)), p = t.players.find(p => p.number === num);
      if (p) p.name = name; else t.players.push({ number: num, name });
      t.players.sort((x, y) => Number(x.number) - Number(y.number)); persist(); closeModal(); renderMatch(); notify('Roster saved'); break;
    }
    case 'new': showModal(`${head('Start a new match?')}<p class="dialog-note">This match stays saved in the Match archive. You can resume it and export it later.</p><div class="dialog-actions"><button class="primary" data-do="confirm-new">Set up another match</button><button class="secondary" data-do="close">Back</button></div>`); break;
    case 'confirm-new':
      clock.running = false; persist(); db.activeId = null; match = null; draft = null; persist(); closeModal();
      setupGameId = ''; setupStatus = '';
      setStatus('<i></i> Ready'); renderSetup(); break;
  }
});
const TIME_FIELDS = ['draft-gametime', 'draft-pentime', 'edit-pentime', 'goalie-time'];
document.addEventListener('focusin', e => { if (TIME_FIELDS.includes(e.target.id)) e.target.select(); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'draft-gametime') { e.preventDefault(); $('[data-do="time-confirm"]')?.click(); } });
document.addEventListener('input', e => { if (TIME_FIELDS.includes(e.target.id)) e.target.value = timeMask(e.target.value); if (e.target.id === 'game-no') setupGameNo = e.target.value; if (e.target.id === 'draft-gametime' && draft) draft.timeText = e.target.value; if (e.target.id === 'draft-pentime' && draft) draft.penTime = e.target.value; });
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'set-source') { activeSourceId = e.target.value; return; }
  if (id === 'data-file-input') { loadDataFromFiles([...e.target.files]); e.target.value = ''; return; }
  if (id === 'setup-source') { activeSourceId = e.target.value; setupGameId = ''; renderSetup(); return; }
  if (id === 'setup-game') { setupGameId = e.target.value; renderSetup(); return; }
  if (id === 'setup-file-input') {
    const files = [...e.target.files]; e.target.value = '';
    setupStatus = 'busy:Reading file…'; renderSetup();
    loadDataFromFiles(files).then(() => {
      setupStatus = pbFiles ? `ok:Loaded ${data.teams.length} teams and ${Object.keys(pbFiles).length} files for ${esc(data.competition)}. Pick a game to start.` : setupStatus;
      renderSetup();
    });
    return;
  }
  if (id === 'set-discipline') {
    readSettingNumbers();
    const preset = DISCIPLINES[e.target.value];
    if (preset) { settingsDraft = { ...settingsDraft, discipline: e.target.value, quarters: preset.quarters, quarterMinutes: preset.quarterMinutes, otMinutes: preset.otMinutes, shotClockSeconds: preset.shotClockSeconds, enabled: [...preset.enabled] }; showSettings(); }
    return;
  }
  if (e.target.dataset?.do === 'set-event') {
    readSettingNumbers();
    const code = e.target.dataset.code;
    if (e.target.checked) { if (!settingsDraft.enabled.includes(code)) settingsDraft.enabled.push(code); }
    else settingsDraft.enabled = settingsDraft.enabled.filter(c => c !== code);
    return;
  }
  if (id === 'draft-offense') { if (draft) draft.offense = e.target.value; const c = $('.confirm-penalty'); if (c) c.disabled = !e.target.value; return; }
  if (id.startsWith('pick-')) { const i = Number(id.at(-1)); setupPicks[i] = e.target.value; setupGoalies[i] = data.teams.find(t => t.id === e.target.value)?.goalie?.number || ''; renderSetup(); return; }
  if (['edit-team', 'edit-player', 'edit-action'].includes(id)) {
    const t = team($('#edit-team').value);
    if (id === 'edit-team') $('#edit-player').innerHTML = playerOptions(t);
    const old = $('#edit-assist').value;
    $('#edit-assist').innerHTML = '<option value="">No</option>' + playerOptions(t, old, $('#edit-player').value);
    $('#assist-field').hidden = $('#edit-action').value !== 'G';
    $('#save-field').hidden = $('#edit-action').value !== 'SS';
    $('#card-field').hidden = $('#offense-field').hidden = $('#pentime-field').hidden = $('#edit-action').value !== 'PEN';
    if (id === 'edit-team') $('#edit-save').innerHTML = saveOptions(t.id, match.goalies?.[match.teams.find(x => x.id !== t.id)?.id] ?? '');
  }
  if (id === 'roster-team') { const t = team(e.target.value); $('#roster-list').innerHTML = rosterList(t); $('#roster-goalie').innerHTML = goalieOptions(t, match.goalies?.[t.id] ?? ''); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'edit-form') return;
  e.preventDefault();
  const id = e.target.dataset.id, old = match.events.find(x => x.id === id), action = $('#edit-action').value, teamId = $('#edit-team').value;
  try {
    const updated = validateEvent({ ...old, teamId, action, period: $('#edit-period').value ? Number($('#edit-period').value) : null, player: $('#edit-player').value, assist: action === 'G' ? ($('#edit-assist').value || null) : null, save: action === 'SS' ? { teamId: match.teams.find(t => t.id !== teamId).id, player: $('#edit-save').value || null } : null, penalty: action === 'PEN' ? { offense: $('#edit-offense').value, card: $('#edit-card').value || null, time: ($('#edit-pentime').value || '').trim() ? fmtGame(parseGame($('#edit-pentime').value) ?? 0) : null } : null }, match.teams);
    match = applyChange(match, match.events.map(x => x.id === id ? updated : x)); draft = null; persist(); closeModal(); renderMatch(); notify('Action updated');
  } catch (err) { $('#edit-error').textContent = err.message; }
});
modal.addEventListener('click', e => { if (e.target === modal) { const r = modal.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeModal(); } });
modal.addEventListener('close', () => { modal.innerHTML = ''; });

/* ---------- Tablet: keep the screen awake, follow rotation ---------- */
let wakeLock = null;
async function keepAwake() { try { if (match && !wakeLock && document.visibilityState === 'visible' && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch { wakeLock = null; } }
document.addEventListener('click', keepAwake);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); if (clock.running) tick(); } else if (match) persist(); });
wide.addEventListener('change', () => { if (match && !modal.open) renderMatch(); });

/* ---------- Boot ---------- */
// Restore the most recently downloaded Pointbench rosters, if any.
let activeSourceId = PB_SOURCES[0].id;
try {
  const saved = JSON.parse(localStorage.getItem(DATA_KEY));
  if (saved?.data?.teams?.length) { applyRosterData(saved.data); if (saved.sourceId) activeSourceId = saved.sourceId; }
} catch {}
match = db.matches.find(m => m.id === db.activeId) || null;
if (match) { loadClock(); renderMatch(); setStatus('<i></i> Saved on this device'); notify('Match restored'); }
else renderSetup();
if (!storageOkay) notify('Saving unavailable. Remember to export your match.');
if (window.claude?.use) window.claude.use('downloads').then(d => { downloads = d; }, () => {});
</script>

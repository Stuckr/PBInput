<title>Sixes Spotter</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#132e38;background:#e9edeb;font-synthesis:none;--ink:#132e38;--muted:#6f7e80;--line:#dce3df;--green:#d7ef5c;--blue:#176189;--red:#af4d37}
*{box-sizing:border-box}body{margin:0}
button,input,select,textarea{font:inherit}
button,a,input,select{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;touch-action:manipulation;border:0}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #b1cd38;outline-offset:3px}
button:disabled{opacity:.35;cursor:default}
a{color:inherit}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
select,input,textarea{font-size:16px!important}
.app{max-width:760px;min-height:100dvh;margin:auto;background:#f7f8f3;box-shadow:0 0 50px #132e3808;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.match-grid{display:flex;flex-direction:column}.match-main,.match-side{display:contents}
.toolbar{order:1}.scoreboard{order:2}.clock-panel{order:3}.period-picker{order:4}.stage-label{order:5}.board{order:6}.summary{order:7}.feed{order:8}.match-footer{order:9;padding-top:6px}
.summary{padding:14px 20px 16px;border-top:1px solid var(--line);background:#f7f8f3}
.summary-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.summary-title h2{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin:0;font-weight:700}
.summary-title span{font-size:10px;letter-spacing:.5px;color:var(--muted)}
.summary-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.summary table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:max-content}
.summary th,.summary td{padding:6px 2px;text-align:center;border-top:1px solid var(--line)}
.summary thead th{border-top:0;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;line-height:1.2;vertical-align:bottom}
.summary tbody th{text-align:left;font-size:11px;color:#5b7065;position:sticky;left:0;background:#f7f8f3;padding-right:8px;z-index:1}
.summary td{white-space:nowrap}
.summary td b,.summary-title .key{display:inline-block;min-width:30px;padding:4px 6px;margin:0 2px;border-radius:6px;font-size:17px;font-weight:800;line-height:1.15;background:var(--c);color:var(--k);box-shadow:inset 0 0 0 1px #132e3833}
.summary td b.zero{background:transparent;color:#8a9a94;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.summary-title .key{font-size:10px;letter-spacing:.5px;min-width:0;padding:3px 7px}
.summary tbody th{font-size:13px!important;font-weight:800;color:var(--ink)!important}
.summary thead th{font-size:10px!important;color:#4d6168!important}
.summary td.now,.summary thead th.now{background:#f0f7cf}
.summary td.total,.summary thead th.total{border-left:2px solid #9fb0a8}
.summary thead th.total,.summary thead th.now{color:var(--ink)!important;font-weight:800}

.game-no{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:11px;color:#61756d;font-weight:700}.game-no small{font-weight:400}.game-no input{width:120px;min-height:42px;border:1px solid #d4ded2;border-radius:7px;background:white;padding:8px 10px;color:var(--ink);text-align:center;font-weight:700}
.topbar{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;padding:4px;background:none;border:0;background:none;color:var(--ink);padding:0;text-align:left}
.brand b{font-weight:800}
.brand-logo{display:block;height:30px;width:auto}
.brand small{display:block;font-size:8px;letter-spacing:2px;color:var(--muted);margin-top:5px;font-weight:700}
.brand-mark{width:32px;height:36px;border:2px solid var(--ink);border-radius:8px 2px;display:grid;place-items:center;font-size:24px;font-weight:900;position:relative}
.brand-mark span{position:absolute;top:-9px;right:-6px;background:#f7f8f3;line-height:18px}
.local-status{font-size:10px;color:#526c62;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:10px}
.settings-btn{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 14px;border-radius:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;letter-spacing:.3px;flex-shrink:0;box-shadow:0 1px 3px #132e3833}
.settings-btn svg{width:18px;height:18px;color:var(--green)}
.settings-btn:active{transform:scale(.97)}
.clock-manual{font-size:11px;font-weight:700;color:#7a5a16;background:#fff6dd;border:1px solid #e7d79a;border-radius:6px;padding:7px 11px}
/* Settings dialog */
.set-group{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.set-group:first-of-type{border-top:0;margin-top:10px}
.set-group h3{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.set-num{display:grid;gap:6px;font-size:12px;color:#51656b;font-weight:600}
.set-num input,.set-num select{min-height:46px;border:1px solid #d4dcd4;border-radius:7px;background:white;padding:9px 11px;color:var(--ink);font-size:16px;font-weight:600}
.set-num small{font-weight:400;color:var(--muted);font-size:10.5px}
.set-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.set-toggle>span{font-size:13px;font-weight:600}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#eef2ea}
.seg2 button{min-height:40px;padding:8px 14px;font-size:12px;font-weight:700;color:#5b7065;background:transparent;border:0}
.seg2 button.on{background:var(--ink);color:white}
.set-events{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.set-check{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid var(--line);border-radius:7px;background:#fbfcf9;font-size:13px;font-weight:600;cursor:pointer}
.set-check input{width:19px;height:19px;flex-shrink:0;accent-color:var(--ink)}
.set-check small{margin-left:auto;font-size:10px;font-weight:700;color:#9aa8a2;letter-spacing:.5px}
.local-status i{display:inline-block;width:6px;height:6px;background:#668a4c;border-radius:50%;margin-right:4px}
.setup{padding:34px 24px}
.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--muted);font-weight:700;margin:0 0 12px}
.setup h1{font-size:36px;line-height:1.06;letter-spacing:-1.5px;margin:0 0 12px;font-weight:800}
.intro{font-size:14px;color:#627477;line-height:1.5;max-width:380px}
.competition{display:flex;align-items:center;gap:10px;font-size:11px;padding:16px 0 22px;margin-top:16px;border-top:1px solid var(--line)}
.pill{background:var(--ink);color:white;border-radius:4px;padding:5px 6px;font-weight:700;font-size:10px}
.team-selectors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team-pick{border:1px solid var(--line);border-top:3px solid var(--team-color,var(--blue));border-radius:9px;background:white;padding:16px 12px;min-width:0}
.team-pick label{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.team-pick select{font-size:15px;font-weight:700;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0 0 10px;background:white;color:var(--ink);min-height:40px}
.goalie-default{font-size:11px;color:#627477;margin:14px 0 0;line-height:1.4}
.color-label{font-size:10px;color:var(--muted);margin:16px 0 6px}
.roster-summary{font-size:11px;color:var(--muted);margin:14px 0 0;min-height:14px}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(28px,1fr));gap:3px;max-width:300px}
.swatch{min-width:28px;height:38px;padding:4px;border-radius:6px;border:2px solid transparent;background:transparent}
.swatch span{display:grid;place-items:center;width:100%;height:100%;min-height:26px;max-width:42px;margin:auto;background:var(--swatch);color:var(--swatch-ink);box-shadow:inset 0 0 0 1px #132e3833;border-radius:50%;font-size:16px;font-weight:800}
.swatch.chosen{border-color:var(--ink)}
dialog .swatches{max-width:none;gap:8px}dialog .swatch{height:52px}dialog .swatch span{max-width:40px}
.primary{background:var(--ink);color:white;border-radius:7px;min-height:54px;padding:14px 20px;font-weight:700}
.start{width:100%;margin-top:20px;display:flex;justify-content:space-between;align-items:center}
.start span{color:var(--green);font-size:20px}
.setup-note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:20px}
.setup-note a{text-underline-offset:3px}
.field-select{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 0}
.field-select>span{font-size:11px;color:#61756d;font-weight:700}
.field-buttons{display:flex;gap:7px}
.field-buttons button{min-height:42px;min-width:104px;padding:8px 14px;border:1px solid #d4ded2;border-radius:7px;background:#e7ece3;color:#52685e;font-size:12px;font-weight:800}
.field-buttons button.selected{background:var(--ink);border-color:var(--ink);color:white}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:17px 20px 12px;gap:6px}
.toolbar-label{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;gap:5px}
.tool{background:transparent;border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-height:40px;font-size:12px;font-weight:700;color:var(--ink)}
.tool svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.scoreboard{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;margin:5px 20px 0;padding:18px 10px 20px;border-bottom:1px solid var(--line)}
.score-team{text-align:center;min-width:0}
.country-code{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--team-accent,var(--blue))}
.country-name{font-size:13px;margin-top:5px}
.kit-picker{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:32px;background:transparent;color:#647770;font-size:10px;padding:4px;margin-top:5px}
.kit-picker i{height:12px;width:12px;border:1px solid #132e3840;border-radius:50%}
.kit-picker span{font-size:13px}
.score{display:flex;justify-content:center;gap:8px;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.score span{color:#b9c5bc;font-weight:400}
.clock-panel{margin:13px 20px 0;padding:14px;border:1px solid var(--line);border-radius:10px;background:#eef2ea}
.clock-panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.clock-panel-head>div:first-child{display:grid;gap:4px}
.clock-panel-head .eyebrow{font-size:8px;margin:0;letter-spacing:1px}
.clock-panel-head .field-select{margin:0}
.clock-panel-head .field-select>span{display:none}
.clock-panel-head .field-buttons button{min-width:76px;min-height:34px;padding:6px 9px;font-size:10px}
.clock-connection{font-size:10px}.clock-connection.live{color:#17683c}.clock-connection.stale{color:#87621a}
.clock-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.clock-read{min-height:38px;min-width:64px;padding:7px 12px;border-radius:6px;background:var(--ink);color:white;font-size:12px;font-weight:700}
.clock-values{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.clock-values>div{display:grid;gap:3px;justify-items:start}
.clock-values span{font-size:9px;color:#66786f}
.clock-values strong{font-size:27px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.clock-links{display:flex;gap:12px}
.clock-values button{background:none;padding:6px 0;font-size:10px;color:#536d61;text-decoration:underline;min-height:28px}
.period-picker{margin:0 20px;padding:12px 0 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.period-picker>span{font-size:11px;color:#61756d}
.period-buttons{display:flex;gap:6px}
.period-buttons button{min-width:42px;min-height:38px;background:#e7ece3;border:1px solid #d4ded2;border-radius:6px;color:#5b7065;font-weight:700;font-size:12px}
.period-buttons button.selected{color:var(--ink);background:var(--green);border-color:#abbf54}
.period-buttons .add-ot{color:#4d6168;background:#fff;border-style:dashed;min-width:48px}
.stage-label{padding:20px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.stage-label p{font-size:12px;margin:0;color:#607377}
.stage-label b{color:var(--ink)}
.cancel{background:transparent;padding:6px 0 6px 8px;min-height:32px;font-size:12px;color:#617273;text-decoration:underline}
.board{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:17px 20px 22px;min-height:245px}
.team-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-content:start}
.team-actions.inactive{opacity:.3}
.change-goalie{grid-column:1/-1;min-height:54px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:5px;padding:10px;border:1px solid var(--team-border);border-radius:7px;background:var(--team-soft);color:var(--team-accent);text-align:left}
.change-goalie span{font-size:12px;font-weight:700}
.change-goalie small{font-size:10px;line-height:1.35;overflow-wrap:anywhere}
.action{height:92px;border-radius:8px;background:var(--team-soft,#eaf0f1);color:var(--team-accent,var(--blue));border:1px solid var(--team-border,#d5e0e3);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:13px 12px;text-align:left}
.action strong{font-size:27px;letter-spacing:-1px;line-height:1}
.action small{font-size:10px;font-weight:600}
.action.goal{background:var(--team-color,var(--blue));color:var(--team-ink,white);border-color:var(--team-border,var(--blue))}
.action:active,.jersey:active{transform:scale(.97)}
.action.penalty{grid-column:1/-1;height:auto;min-height:58px;flex-direction:row;align-items:center}
.team-actions,.number-side{--tint:color-mix(in srgb,var(--team-color) 24%,#fff);--tint-line:color-mix(in srgb,var(--team-color) 40%,var(--team-border))}
.team-actions .action:not(.goal),.team-actions .change-goalie,.number-side .jersey{background:var(--team-soft);background:var(--tint);border-color:var(--team-border);border-color:var(--tint-line)}
.team-actions .change-goalie{background:color-mix(in srgb,var(--team-color) 12%,#fff)}
.action.penalty strong{font-size:17px;letter-spacing:-.3px}
.card-options{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.card-options button{min-height:48px;border-radius:6px;border:1px solid var(--line);background:white;color:var(--ink);font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;padding:8px 9px;text-align:left}
.card-options button.chosen{border:2px solid var(--ink);padding:7px 8px}
.card-options i,.card-chip{display:inline-block;width:11px;height:15px;border-radius:2px;box-shadow:inset 0 0 0 1px #132e3840;flex-shrink:0}
.card-chip{margin-left:6px;vertical-align:-2px}
.time-input{width:100%;min-height:52px;border:1px solid #d4dcd4;border-radius:8px;background:white;padding:10px 12px;color:var(--ink);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;text-align:center;margin-bottom:10px}
.confirm-time,.confirm-penalty{width:100%}
.offense-label{display:block;font-size:11px;color:#6b7c73;margin:13px 0 6px}
.offense-select{width:100%;min-height:46px;border:1px solid #d4dcd4;border-radius:6px;background:white;padding:10px;color:var(--ink);font-size:13px}
.confirm-penalty{width:100%;margin-top:10px;min-height:50px}
.number-side{min-width:0}
.number-head{font-size:10px;font-weight:700;color:var(--team-accent,var(--blue));letter-spacing:1px;display:flex;justify-content:space-between;margin-bottom:9px}
.jerseys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.jersey{height:46px;border:1px solid var(--team-border,#d2dfe1);border-radius:6px;background:var(--team-soft,#eaf0f1);color:var(--team-accent,var(--blue));font-size:20px;font-weight:800;padding:0}
.waiting{color:#99a5a1;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:8px;min-height:200px;font-size:11px}
.waiting span{font-size:22px}
.assist-options{display:grid;gap:10px}
.assist-options button{min-height:80px;border-radius:7px;font-size:23px;font-weight:800;background:var(--team-color,var(--blue));color:var(--team-ink,white);border:1px solid var(--team-border)}
.assist-options button.no{background:white;color:var(--ink);border:1px solid var(--line)}
.draft-details{font-size:12px;color:#617273;padding-bottom:10px;line-height:1.5}
.feed{border-top:1px solid var(--line);padding:0 20px 16px;touch-action:pan-y;background:#eff2eb}
.feed-handle{display:block;width:35px;height:4px;border-radius:3px;background:#c6d0c6;margin:10px auto 12px}
.feed-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;gap:10px}
.feed-title h2{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin:0;font-weight:700}
.feed-title button{font-size:11px;color:#526562;min-height:32px;background:transparent}
.event{display:grid;grid-template-columns:22px 35px 1fr 44px;align-items:center;text-align:left;gap:8px;width:100%;min-height:48px;border-top:1px solid #dce3d9;background:transparent;color:var(--ink);padding:8px 0}
.event-index{font-size:10px;color:#83918a;font-variant-numeric:tabular-nums}
.event-period{display:block;font-size:8px;color:#5a7161;margin-top:3px}
.event-code{font-size:9px;font-weight:800;letter-spacing:.5px;width:fit-content;padding-bottom:3px}
.event-action{font-size:12px;font-weight:700;min-width:0}
.event-action small{font-size:10px;display:block;color:#6b7c73;font-weight:400;margin-top:4px}
.event-action small.event-clock{font-size:9px;color:#536d61;line-height:1.35;overflow-wrap:anywhere}
.event-num{text-align:right;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.event-num small{font-size:10px;font-weight:500}
.empty-feed{font-size:12px;color:#7b8a80;text-align:center;line-height:1.6;padding:15px 5px}
.match-footer{display:flex;justify-content:space-between;font-size:10px;color:#7d8b81;align-items:center;padding:0 20px 16px}
.match-footer button{background:none;color:inherit;padding:10px 0;text-decoration:underline;min-height:40px;font-size:11px}
dialog{color:var(--ink);background:#f7f8f3;border:0;border-radius:15px;padding:24px;width:calc(100% - 28px);max-width:650px;max-height:90dvh;box-shadow:0 20px 100px #0003}
dialog::backdrop{background:#102b36aa;backdrop-filter:blur(3px)}
.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dialog-head h2{font-size:22px;letter-spacing:-.6px;margin:0}
.close{background:#e8ece5;color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:24px;flex-shrink:0}
.dialog-note{font-size:12px;line-height:1.6;color:#6b7d76}
.full-events{margin-top:15px;max-height:55dvh;overflow:auto}
.dialog-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.secondary{min-height:48px;background:#e6ebe3;color:var(--ink);padding:10px 17px;border-radius:6px;font-weight:700}
.danger{background:#f6e5df;color:#a34630}
.fields{display:grid;gap:14px;margin-top:22px}
.fields label{font-size:11px;color:#6b7c73;display:grid;gap:7px}
.fields select,.fields input{min-height:46px;border:1px solid #d4dcd4;border-radius:6px;background:white;padding:10px;color:var(--ink);width:100%}
.archive-item{text-align:left}
.archive-item small{display:block;font-size:11px;font-weight:400;margin-top:5px}
.export-text{display:block;width:100%;height:40dvh;margin-top:12px;border:1px solid #d4dcd4;border-radius:6px;background:white;padding:10px;color:var(--ink);font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;resize:vertical}
.error{font-size:12px;color:#b14e34;line-height:1.5}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:white;padding:13px 20px;border-radius:9px;font-size:12px;max-width:90vw;opacity:0;pointer-events:none;transition:.2s;z-index:10;box-shadow:0 4px 30px #0002}
#toast.visible{opacity:1;transform:translate(-50%,0)}
@media(min-width:600px){.summary{padding:16px 30px 18px}.setup{padding:45px}.setup h1{font-size:46px}.team-pick{padding:22px}.board{padding:22px 30px 28px;gap:38px}.action{height:110px;padding:17px}.action strong{font-size:34px}.action small{font-size:12px}.jersey{height:58px}.feed{padding:0 30px 20px}.topbar{padding:0 30px}.stage-label{padding:22px 30px 0}.toolbar{padding:20px 30px 12px}.period-picker{margin:0 30px}.period-buttons button{min-width:48px}.swatch{height:42px}.clock-panel{margin-left:30px;margin-right:30px}.field-select{margin-top:22px}.scoreboard{margin:5px 30px 0}.match-footer{padding:0 30px 16px}}
@media(max-width:520px){.summary{padding-left:12px;padding-right:12px}.summary tbody th{width:38px}.summary td b{min-width:22px;padding:3px 3px;margin:0 1px;font-size:14px}}
@media(max-width:480px){.set-grid,.set-events{grid-template-columns:1fr}}
@media(max-width:420px){.field-select{gap:8px}.field-buttons{gap:5px}.field-buttons button{min-width:88px;padding:8px 9px}.clock-panel{margin-left:15px;margin-right:15px;padding:12px}.clock-panel-head .field-buttons button{min-width:60px;padding:6px}.clock-values strong{font-size:24px}.tool{padding:9px 8px}}
@media(max-width:360px){.settings-btn span{display:none}.settings-btn{padding:9px 11px}}
@media(max-width:350px){.topbar{padding:0 15px}.board{padding:15px;gap:14px}.toolbar{padding-left:15px;padding-right:15px}.toolbar-label{letter-spacing:0;font-size:8px}.action{padding:11px 8px}.action small{font-size:9px}.setup{padding:28px 16px}.jerseys{gap:5px}.team-pick{padding:14px 8px}.swatch{padding:3px;min-width:24px}.swatches{grid-template-columns:repeat(4,minmax(24px,1fr))}.period-picker{margin:0 15px}.period-buttons{gap:4px}.period-buttons button{min-width:37px}}
@media(min-width:1000px) and (orientation:landscape){
.app{max-width:1240px}
.topbar{height:60px}
.match-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;align-items:start}
.match-main{display:block}
.match-side{display:flex;flex-direction:column;border-left:1px solid var(--line);position:sticky;top:0;height:calc(100dvh - 61px - env(safe-area-inset-top) - env(safe-area-inset-bottom));background:#eff2eb}
.match-side .clock-panel{margin:16px 20px;background:#f7f8f3}
.match-side .summary{background:transparent;padding:10px 20px 12px}.match-side .summary tbody th{background:#eff2eb}.match-side .summary th,.match-side .summary td{padding:3px 3px}.match-side .summary td b{min-width:22px;padding:3px 4px;margin:0 1px;font-size:14px}
.match-side .feed{border-top:1px solid var(--line);padding:0 20px 16px;flex:1;min-height:0;overflow:auto}
.match-side .feed-handle{visibility:hidden;margin:4px auto}
.match-side .match-footer{padding:6px 20px 12px}
.toolbar{padding-top:14px}.scoreboard{padding-top:10px;padding-bottom:14px}
.board{min-height:0}
}
</style>

const head = title => `<div class="dialog-head"><h2>${title}</h2><button class="close" data-do="close" aria-label="Close">×</button></div>`;

/* ---------- Clock (manual: 8:00 quarters, 30 s shot clock) ---------- */
const fmtGame = ms => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
// Parse a m:ss or seconds string to milliseconds, or null if invalid.
const parseGame = txt => { const m = /^\s*(\d{1,3})(?::([0-5]?\d))?\s*$/.exec(txt || ''); return m ? (m[2] == null ? Number(m[1]) : Number(m[1]) * 60 + Number(m[2])) * 1000 : null; };
const fmtShot = ms => String(Math.ceil(ms / 1000));
// Game time at the start of the current period: full length when counting
// down, 0 when counting up.
const startGame = period => settings.countUp ? 0 : periodMs(period);
// The period is over when the clock reaches the end in either direction.
const clockEnded = () => settings.countUp ? clock.game >= periodMs(currentPeriod()) : clock.game <= 0;
function tick() {
  if (!clock.running) return;
  const now = Date.now(), d = now - clock.at; clock.at = now;
  const len = periodMs(currentPeriod());
  clock.game = settings.countUp ? Math.min(len, clock.game + d) : Math.max(0, clock.game - d);
  clock.shot = Math.max(0, clock.shot - d);
  if (clockEnded()) { clock.running = false; persist(); if (match && !draft) renderMatch(); notify(`End of ${periodLabel(currentPeriod())}`); return; }
  paintClock();
}
function paintClock() { const g = $('#game-clock'), s = $('#shot-clock'); if (g) g.textContent = fmtGame(clock.game); if (s) s.textContent = fmtShot(clock.shot); }
setInterval(tick, 200);
function loadClock() { clock = { game: match?.clock?.game ?? startGame(currentPeriod()), shot: match?.clock?.shot ?? SHOT_MS(), running: false, at: 0 }; }
function captureClock() { return { field: match?.field ?? null, gameTime: fmtGame(clock.game), shotTime: fmtShot(clock.shot), status: clock.running ? 'running' : 'stopped', capturedAt: new Date().toISOString() }; }
function clockPanel() {
  const resetLabel = settings.countUp ? '0:00' : fmtGame(periodMs(currentPeriod()));
  const status = clock.running ? 'Running' : clockEnded() ? 'Period over' : 'Stopped';
  const toggle = settings.autoClock
    ? `<button class="clock-read" data-do="clock-toggle" ${clockEnded() && !clock.running ? 'disabled' : ''}>${clock.running ? 'Stop' : 'Start'}</button>`
    : '<span class="clock-manual">Manual</span>';
  return `<div class="clock-panel-head"><div><span class="eyebrow">Clock · Field ${match.field ?? '—'} · ${settings.countUp ? 'count up' : 'count down'}</span><strong class="clock-connection ${clock.running ? 'live' : 'stale'}">${status}</strong></div><div class="clock-controls">${fieldPicker('match', match.field)}${toggle}</div></div><div class="clock-values"><div><span>Game clock</span><strong id="game-clock">${fmtGame(clock.game)}</strong><div class="clock-links"><button data-do="clock-set-game">Set time</button><button data-do="clock-reset-game">Reset to ${resetLabel}</button></div></div><div><span>Shot clock</span><strong id="shot-clock">${fmtShot(clock.shot)}</strong><div class="clock-links"><button data-do="clock-set-shot">Set</button><button data-do="clock-reset-shot">Reset to ${settings.shotClockSeconds}</button></div></div></div>`;
}

/* ---------- Shared fragments ---------- */
const paletteStyle = (t, i = 0) => { const c = teamPalette(t, i); return `--team-color:${c.hex};--team-ink:${c.ink};--team-soft:${c.soft};--team-accent:${c.accent};--team-border:${c.border};`; };
const teamOptions = (sel = '', exclude = '') => '<option value="">Choose…</option>' + data.teams.map(t => `<option value="${t.id}" ${t.id === sel ? 'selected' : ''} ${t.id === exclude ? 'disabled' : ''}>${esc(t.name)}</option>`).join('');
const goalieOptions = (t, sel = '') => `<option value="">No active goalkeeper</option>${(t?.players || []).map(p => `<option value="${esc(p.number)}" ${String(p.number) === String(sel) ? 'selected' : ''}>#${esc(p.number)} · ${esc(p.name)}</option>`).join('')}`;
const playerOptions = (t, cur, exclude) => t.players.filter(p => p.number !== exclude).map(p => `<option value="${esc(p.number)}" ${p.number === cur ? 'selected' : ''}>#${esc(p.number)} · ${esc(p.name)}</option>`).join('');
const saveOptions = (shootingId, sel = '') => { const t = match.teams.find(t => t.id !== shootingId); return `<option value="">Not assigned</option>${t ? playerOptions(t, sel) : ''}`; };
const swatches = (color, side, scope = 'setup') => `<div class="swatches" role="group" aria-label="Jersey colour, team ${side + 1}">${COLORS.map(c => `<button class="swatch ${c.id === color ? 'chosen' : ''}" style="--swatch:${c.hex};--swatch-ink:${c.ink}" data-do="color" data-scope="${scope}" data-side="${side}" data-color="${c.id}" aria-label="${c.name}, team ${side + 1}" aria-pressed="${c.id === color}" title="${c.name}"><span>${c.id === color ? '✓' : ''}</span></button>`).join('')}</div>`;
const fieldPicker = (scope, sel) => `<section class="field-select" aria-label="Select playing field"><span>Playing field</span><div class="field-buttons">${[1, 2].map(n => `<button data-do="${scope === 'setup' ? 'setup-field' : 'field'}" data-field="${n}" class="${String(sel ?? '') === String(n) ? 'selected' : ''}" aria-pressed="${String(sel ?? '') === String(n)}" ${scope === 'match' && draft ? 'disabled' : ''}>Field ${n}</button>`).join('')}</div></section>`;
const offenseOptions = (sel = '') => '<option value="">Choose offense…</option>' + Object.entries(OFFENSES).map(([g, list]) => `<optgroup label="${g}">${list.map(o => `<option ${o === sel ? 'selected' : ''}>${esc(o)}</option>`).join('')}</optgroup>`).join('');
const cardButtons = card => `<div class="card-options" role="group" aria-label="Card given">${[null, 'green', 'yellow', 'red'].map(c => `<button data-do="penalty-card" data-card="${c ?? ''}" class="${(card ?? null) === c ? 'chosen' : ''}" aria-pressed="${(card ?? null) === c}"><i style="background:${c ? CARDS[c].hex : 'transparent'}"></i>${c ? CARDS[c].name : 'No card'}</button>`).join('')}</div>`;
const periodButtons = () => {
  const last = periodsInPlay(), list = Array.from({ length: last }, (_, i) => i + 1);
  const btn = q => `<button data-do="period" data-period="${q}" class="${currentPeriod() === q ? 'selected' : ''}" aria-pressed="${currentPeriod() === q}" ${draft ? 'disabled' : ''} aria-label="${periodLabel(q)}">${periodLabel(q)}</button>`;
  const add = last < maxPeriod() ? `<button data-do="add-ot" class="add-ot" ${draft ? 'disabled' : ''} aria-label="Add overtime period">+OT</button>` : '';
  return `<section class="period-picker" aria-label="Period"><span>Period</span><div class="period-buttons">${list.map(btn).join('')}${add}</div></section>`;
};

/* ---------- Setup screen ---------- */
function renderSetup() {
  draft = null;
  const ready = setupPicks[0] && setupPicks[1] && setupPicks[0] !== setupPicks[1] && setupField;
  main.innerHTML = `<section class="setup"><p class="eyebrow">Watch. Call. Review.</p><h1>Every play.<br>Just a few taps.</h1><p class="intro">Choose the teams and field. The first goalkeeper listed by Pointbench is selected automatically; select the shooter after Shot Saved; the opposing goalkeeper receives the save. Change the active goalkeeper in Roster.</p><div class="competition"><span class="pill">SIXES</span><span>${esc(data.competition)}</span></div><div class="team-selectors">${[0, 1].map(i => {
    const t = data.teams.find(t => t.id === setupPicks[i]);
    return `<div class="team-pick" style="${paletteStyle({ color: setupColors[i] }, i)}"><label for="pick-${i}">Team ${i + 1}</label><select id="pick-${i}">${teamOptions(setupPicks[i], setupPicks[1 - i])}</select>${t?.goalie ? `<p class="goalie-default">Starting goalkeeper · #${esc(t.goalie.number)} · ${esc(t.goalie.name)}</p>` : ''}<p class="color-label">Jersey colour</p>${swatches(setupColors[i], i)}<p class="roster-summary">${t ? `${t.players.length} jersey numbers available` : 'Select a team to load its roster'}</p></div>`;
  }).join('')}</div>${fieldPicker('setup', setupField)}<label class="game-no"><span>Game number <small>(optional, used in the XML export)</small></span><input id="game-no" inputmode="numeric" maxlength="4" placeholder="e.g. 59" value="${esc(setupGameNo)}"></label><button class="primary start" data-do="start" ${ready ? '' : 'disabled'}>Start match <span>↗</span></button>${db.matches.length ? `<button class="secondary" style="width:100%;margin-top:12px" data-do="archives">Match archive (${db.matches.length})</button>` : ''}<p class="setup-note">Rosters from <a href="${esc(data.source)}" target="_blank" rel="noopener">World Lacrosse / Pointbench ↗</a>.<br>Data imported ${new Date(data.fetchedAt).toLocaleDateString('en-GB')}. Jersey numbers can be edited during the match.</p></section>`;
}

/* ---------- Match screen ---------- */
function actionButtons(t, side) {
  const inactive = !match.field, goalie = t.players.find(p => p.number === match.goalies?.[t.id]);
  return `<div style="${paletteStyle(t, side)}" class="team-actions ${inactive ? 'inactive' : ''}"><button class="change-goalie" data-do="change-goalie" data-team="${t.id}" aria-label="Change the goalie · ${esc(t.name)}"><span>Change the goalie</span><small>${goalie ? `#${esc(goalie.number)} · ${esc(goalie.name)}` : 'Select goalkeeper'}</small></button>${Object.entries(ACTIONS).map(([code, label]) => `<button class="action ${code === 'G' ? 'goal' : code === 'PEN' ? 'penalty' : ''}" data-do="action" data-team="${t.id}" data-action="${code}" ${inactive ? 'disabled' : ''} aria-label="${esc(t.name)} — ${label}"><strong>${code === 'G' ? 'Goal' : code === 'PEN' ? 'Penalty' : code}</strong><small>${code === 'PEN' ? 'Foul · card' : label}</small></button>`).join('')}</div>`;
}
function numberSide(t, side) {
  if (t.id !== draft.teamId) return `<div class="waiting"><span>· · ·</span>${esc(t.name)}</div>`;
  if (draft.stage === 'assist-choice') return `<div style="${paletteStyle(t, side)}" class="number-side"><div class="draft-details">Goal: <b>#${esc(draft.player)}</b><br>Assist?</div><div class="assist-options"><button data-do="assist-yes">Assist</button><button class="no" data-do="assist-no">No</button></div></div>`;
  if (draft.stage === 'game-time') return `<div style="${paletteStyle(t, side)}" class="number-side"><div class="draft-details">${esc(ACTIONS[draft.action] || draft.action)}: <b>#${esc(draft.player)}</b><br>Game clock when it happened</div><input id="draft-gametime" class="time-input" inputmode="numeric" placeholder="MM:SS" value="${esc(draft.timeText ?? '')}" aria-label="Game clock time, minutes and seconds"><button class="primary confirm-time" data-do="time-confirm">Save action</button></div>`;
  if (draft.stage === 'penalty') return `<div style="${paletteStyle(t, side)}" class="number-side"><div class="draft-details">Penalty: <b>#${esc(draft.player)}</b><br>Card given?</div>${cardButtons(draft.card)}<label class="offense-label" for="draft-offense">Offense</label><select id="draft-offense" class="offense-select">${offenseOptions(draft.offense)}</select><label class="offense-label" for="draft-pentime">Penalty time <small>(MM:SS, optional)</small></label><input id="draft-pentime" class="time-input" inputmode="numeric" placeholder="e.g. 1:00" value="${esc(draft.penTime ?? '')}"><button class="primary confirm-penalty" data-do="penalty-confirm" ${draft.offense ? '' : 'disabled'}>Save penalty</button></div>`;
  const assist = draft.stage === 'assist-player';
  return `<div style="${paletteStyle(t, side)}" class="number-side"><div class="number-head"><span>${assist ? 'ASSIST' : 'NUMBER'}</span><span>${assist ? 'A' : draft.action}</span></div><div class="jerseys">${t.players.map(p => `<button class="jersey" data-do="number" data-number="${esc(p.number)}" ${assist && p.number === draft.player ? 'disabled' : ''} title="${esc(p.name)}" aria-label="Jersey number ${esc(p.number)}, ${esc(p.name)}">${esc(p.number)}</button>`).join('')}</div></div>`;
}
function eventRow(e, index) {
  const c = e.clock, clockLine = c ? `Field ${c.field ?? '—'} · ${c.gameTime ?? '--:--'}${c.shotTime ? ` · shot ${c.shotTime}` : ''}` : '';
  const row = (t, number, label, detail, isSave = false) => {
    const pal = teamPalette(t, match.teams.indexOf(t));
    return `<button class="event" data-do="edit" data-id="${esc(e.id)}" aria-label="Edit action ${index + 1}, ${esc(t?.name ?? 'Unknown team')}, ${esc(label)}"><span class="event-index">${isSave ? '↳' : String(index + 1).padStart(2, '0')}<small class="event-period">${periodLabel(e.period, '—')}</small></span><span class="event-code" style="color:${pal.accent};border-bottom:3px solid ${pal.hex}">${esc(t?.id?.toUpperCase() ?? '—')}</span><span class="event-action">${esc(label)}${!isSave && CARDS[e.penalty?.card] ? `<i class="card-chip" style="background:${CARDS[e.penalty.card].hex}" title="${cardName(e.penalty.card)}"></i>` : ''}${detail ? `<small>${esc(detail)}</small>` : ''}${c && !isSave ? `<small class="event-clock">${esc(clockLine)}</small>` : ''}</span><span class="event-num">${number == null ? '—' : `<small>#</small>${esc(number)}`}</span></button>`;
  };
  const shooting = team(e.teamId), shooter = shooting?.players.find(p => p.number === e.player);
  const detail = e.action === 'G' ? (e.assist !== null ? `Assist #${e.assist}` : 'No assist') : e.action === 'PEN' ? penaltyText(e.penalty) : shooter?.name ?? '';
  const first = row(shooting, e.player, ACTIONS[e.action], detail);
  if (e.action !== 'SS') return first;
  const defending = match.teams.find(t => e.save ? t.id === e.save.teamId : t.id !== e.teamId), goalie = defending?.players.find(p => p.number === e.save?.player);
  return first + row(defending, e.save?.player ?? null, 'Save', goalie?.name ?? 'Goalkeeper not assigned', true);
}
function teamHeading(t, side) {
  const c = teamPalette(t, side);
  return `<div class="score-team" style="${paletteStyle(t, side)}"><div class="country-code">${esc(t.id.toUpperCase())}</div><div class="country-name">${esc(t.name)}</div><button class="kit-picker" data-do="choose-color" data-side="${side}" aria-label="${esc(t.name)} jersey colour: ${c.name}"><i style="background:${c.hex}"></i>${c.name}<span>⌄</span></button></div>`;
}
function renderMatch() {
  const [a, b] = match.teams, n = match.events.length, latest = 3;
  const clockHtml = `<section class="clock-panel" id="clock-panel">${clockPanel()}</section>`;
  let hint = !match.field ? 'Choose Field 1 or Field 2 before recording actions' : 'Select an action';
  if (draft) hint = draft.stage === 'game-time' ? 'Enter the game clock (MM:SS)' : draft.stage === 'assist-choice' ? 'Confirm the assist' : draft.stage === 'assist-player' ? 'Select the assisting player' : draft.stage === 'penalty' ? 'Card, offense and time' : draft.action === 'SS' ? 'Select the shooter' : 'Select the player';
  main.innerHTML = `<div class="match-grid"><div class="match-main"><div class="toolbar"><span class="toolbar-label">Match in progress</span><div class="tools"><button class="tool" data-do="undo" ${!draft && !match.undo?.length ? 'disabled' : ''}>${undoIcon}Undo</button><button class="tool" data-do="export" aria-label="Export PDF">${exportIcon}PDF</button><button class="tool" data-do="export-csv" aria-label="Export CSV">CSV</button><button class="tool" data-do="export-xml" aria-label="Export XML">XML</button></div></div><div class="scoreboard">${teamHeading(a, 0)}<div class="score" aria-label="Score ${score(a.id)} to ${score(b.id)}">${score(a.id)}<span>:</span>${score(b.id)}</div>${teamHeading(b, 1)}</div>${wide.matches ? '' : clockHtml}${periodButtons()}<div class="stage-label"><p>${draft ? `<b>${draft.action === 'G' ? 'Goal' : draft.action === 'PEN' ? 'Penalty' : draft.action}</b> · ` : ''}${hint}</p>${draft ? '<button class="cancel" data-do="cancel">Cancel</button>' : '<span class="eyebrow" style="font-size:8px;margin:0">Team → Action → #</span>'}</div><section class="board" aria-label="Action entry">${match.teams.map((t, i) => draft ? numberSide(t, i) : actionButtons(t, i)).join('')}</section></div><aside class="match-side">${wide.matches ? clockHtml : ''}${summaryHtml()}<section class="feed" id="feed"><span class="feed-handle"></span><div class="feed-title"><h2>Latest actions</h2><button data-do="history">View all (${n}) ↑</button></div>${n ? match.events.slice(-latest).map((e, i) => eventRow(e, Math.max(0, n - latest) + i)).join('') : '<div class="empty-feed">The match starts here.<br>Your most recent actions will stay visible.</div>'}</section><div class="match-footer"><button data-do="rosters">Roster</button><span>${n} action${n === 1 ? '' : 's'}</span><button data-do="new">New match</button></div></aside></div>`;
  let startY; const feed = $('#feed');
  feed.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
  feed.addEventListener('touchend', e => { if (startY - e.changedTouches[0].clientY > 40) showHistory(); }, { passive: true });
}
// After the player (and, in manual mode, the game time) are set, go to the
// action-specific sub-step or commit.
function afterPlayer() {
  if (draft.action === 'G') { draft.stage = 'assist-choice'; renderMatch(); }
  else if (draft.action === 'PEN') { draft.stage = 'penalty'; draft.card = null; draft.offense = ''; draft.penTime = ''; renderMatch(); }
  else finalize();
}
// The last gate before an event is saved. In manual timing the game clock is
// asked here — always the final input, after player, assist, card, etc.
function finalize() {
  if (!settings.autoClock) { draft.stage = 'game-time'; draft.timeText = ''; renderMatch(); setTimeout(() => $('#draft-gametime')?.focus(), 30); }
  else commitDraft();
}
function commitDraft() {
  try {
    if (!match.field) throw Error('Choose Field 1 or Field 2 before recording an action.');
    const ev = validateEvent({ id: crypto.randomUUID(), teamId: draft.teamId, action: draft.action, player: draft.player, period: draft.period, assist: draft.assist ?? null, save: draft.action === 'SS' ? draft.save : null, penalty: draft.action === 'PEN' ? { offense: draft.offense, card: draft.card ?? null, time: draft.penTime || null } : null, clock: draft.clock }, match.teams);
    match = applyChange(match, [...match.events, ev]); draft = null; persist(); renderMatch();
  } catch (err) { notify(err.message); }
}
function undo() {
  if (draft) { draft = null; renderMatch(); notify('Current entry cancelled'); return; }
  if (!match.undo?.length) return;
  match = undoChange(match); persist(); renderMatch(); notify('Last change undone');
}

/* ---------- Summary: counts per quarter under each category ---------- */
function summaryHtml() {
  const codes = Object.keys(ACTIONS), ids = match.teams.map(t => t.id), pal = match.teams.map((t, i) => teamPalette(t, i));
  const periods = Array.from({ length: periodsInPlay() }, (_, i) => i + 1);
  const count = (q, code, id) => match.events.filter(e => e.action === code && e.teamId === id && (q == null || e.period === q)).length;
  const cell = (q, code) => ids.map((id, i) => { const n = count(q, code, id); return `<b class="${n ? '' : 'zero'}" style="--c:${pal[i].hex};--k:${pal[i].ink};--a:${pal[i].accent}">${n}</b>`; }).join('');
  // Rows are categories; columns are each period plus a Total.
  const bodyRow = code => `<tr><th scope="row">${ACTIONS[code]}</th>${periods.map(q => `<td class="${currentPeriod() === q ? 'now' : ''}">${cell(q, code)}</td>`).join('')}<td class="total">${cell(null, code)}</td></tr>`;
  return `<section class="summary" aria-label="Summary by period"><div class="summary-title"><h2>Summary</h2><span>${match.teams.map((t, i) => `<b class="key" style="--c:${pal[i].hex};--k:${pal[i].ink}">${esc(t.id.toUpperCase())}</b>`).join('')}</span></div><div class="summary-scroll"><table><thead><tr><th></th>${periods.map(q => `<th scope="col" class="${currentPeriod() === q ? 'now' : ''}">${periodLabel(q)}</th>`).join('')}<th scope="col" class="total">Total</th></tr></thead><tbody>${codes.map(bodyRow).join('')}</tbody></table></div></section>`;
}

function setGoalie(teamId, number) {
  match.goalies = { ...(match.goalies || {}), [teamId]: number || null };
  if (number) (match.goalieLog ||= []).push({ teamId, player: number, period: currentPeriod(), clock: captureClock(), at: new Date().toISOString() });
}

/* ---------- Dialogs ---------- */
function showHistory() {
  showModal(`${head('Match history')}<p class="dialog-note">${esc(match.teams[0].name)} — ${esc(match.teams[1].name)} · ${match.events.length} actions<br>Tap a row to edit an entry.</p><div class="full-events">${match.events.map((e, i) => eventRow(e, i)).join('') || '<p class="dialog-note">No actions recorded.</p>'}</div><div class="dialog-actions"><button class="primary" data-do="export">Export PDF</button><button class="secondary" data-do="export-csv">CSV</button><button class="secondary" data-do="export-xml">XML</button><button class="secondary" data-do="close">Back to match</button></div>`);
}
function showEdit(id) {
  const e = match.events.find(e => e.id === id); if (!e) return;
  showModal(`${head('Edit action')}<p class="dialog-note">Action ${match.events.indexOf(e) + 1} · This edit keeps the action in its original place in the history.</p><form id="edit-form" data-id="${e.id}"><div class="fields"><label>Team<select id="edit-team">${match.teams.map(t => `<option value="${t.id}" ${e.teamId === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></label><label>Period<select id="edit-period">${e.period == null ? '<option value="">Not recorded</option>' : ''}${Array.from({ length: Math.max(periodsInPlay(), e.period || 0) }, (_, i) => i + 1).map(q => `<option value="${q}" ${e.period === q ? 'selected' : ''}>${periodLabel(q)}</option>`).join('')}</select></label><label>Action<select id="edit-action">${Object.entries(ACTIONS).map(([c, l]) => `<option value="${c}" ${c === e.action ? 'selected' : ''}>${l}</option>`).join('')}</select></label><label>Player<select id="edit-player">${playerOptions(team(e.teamId), e.player)}</select></label><label id="save-field" ${e.action !== 'SS' ? 'hidden' : ''}>Opposing goalkeeper (save)<select id="edit-save">${saveOptions(e.teamId, e.save?.player ?? '')}</select></label><label id="card-field" ${e.action !== 'PEN' ? 'hidden' : ''}>Card given<select id="edit-card"><option value="">No card</option>${Object.entries(CARDS).map(([c, v]) => `<option value="${c}" ${e.penalty?.card === c ? 'selected' : ''}>${v.name} card</option>`).join('')}</select></label><label id="offense-field" ${e.action !== 'PEN' ? 'hidden' : ''}>Offense<select id="edit-offense">${offenseOptions(e.penalty?.offense ?? '')}</select></label><label id="pentime-field" ${e.action !== 'PEN' ? 'hidden' : ''}>Penalty time (MM:SS)<input id="edit-pentime" inputmode="numeric" placeholder="e.g. 1:00" value="${esc(e.penalty?.time ?? '')}"></label><label id="assist-field" ${e.action !== 'G' ? 'hidden' : ''}>Assist<select id="edit-assist"><option value="">No</option>${playerOptions(team(e.teamId), e.assist, e.player)}</select></label></div><p class="error" id="edit-error" role="alert"></p><div class="dialog-actions"><button class="primary" type="submit">Save changes</button><button class="secondary danger" type="button" data-do="delete" data-id="${e.id}">Delete</button></div></form>`);
}
function showQuickGoalie(teamId) {
  const t = match.teams.find(t => t.id === teamId); if (!t) return;
  showModal(`${head('Change the goalie')}<p class="dialog-note">${esc(t.name)} · Applies to the next saves.</p><div class="fields"><label>New goalkeeper<select id="quick-goalie">${goalieOptions(t, match.goalies?.[t.id] ?? '')}</select></label></div><div class="dialog-actions"><button class="primary" data-do="save-quick-goalie" data-team="${t.id}">Confirm goalkeeper</button><button class="secondary" data-do="close">Cancel</button></div>`);
}
const rosterList = t => t.players.map(p => `#${esc(p.number)} ${esc(p.name)}`).join('<br>');
function showRosters() {
  const t = match.teams[0];
  showModal(`${head('Edit roster')}<p class="dialog-note">Set the active goalkeeper. Shots saved against the opposing team will credit this goalkeeper automatically. A goalkeeper change applies to the next saves; edit earlier actions in the history if needed.</p><div class="fields"><label>Team<select id="roster-team">${match.teams.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label><label>Active goalkeeper<select id="roster-goalie">${goalieOptions(t, match.goalies?.[t.id] ?? '')}</select></label></div><div class="dialog-actions"><button class="primary" data-do="save-goalie">Save goalkeeper</button></div><p class="dialog-note">Add or edit a player</p><div class="fields"><label>Jersey number<input id="roster-number" inputmode="numeric" maxlength="3" placeholder="e.g. 27"></label><label>Player name<input id="roster-name" maxlength="100" placeholder="First and last name"></label></div><p class="error" id="roster-error"></p><div class="dialog-actions"><button class="secondary" data-do="save-player">Add / edit player</button></div><p class="dialog-note" id="roster-list">${rosterList(t)}</p>`);
}
let settingsDraft = null;
// Pull the number fields into the draft so they survive a re-render.
function readSettingNumbers() {
  if (!settingsDraft) return;
  const read = (id, min, max, cur) => { const el = $('#' + id); if (!el) return cur; const n = Math.round(Number(el.value)); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : cur; };
  settingsDraft.quarters = read('set-quarters', 1, 6, settingsDraft.quarters);
  settingsDraft.quarterMinutes = read('set-qmin', 1, 60, settingsDraft.quarterMinutes);
  settingsDraft.otMinutes = read('set-otmin', 1, 30, settingsDraft.otMinutes);
  settingsDraft.shotClockSeconds = read('set-shot', 0, 120, settingsDraft.shotClockSeconds);
}
function showSettings() {
  settingsDraft = settingsDraft || { ...settings, enabled: [...settings.enabled] };
  const d = settingsDraft;
  const num = (id, label, value, min, max, hint = '') => `<label class="set-num">${label}<input id="${id}" type="number" inputmode="numeric" min="${min}" max="${max}" value="${value}">${hint ? `<small>${hint}</small>` : ''}</label>`;
  const toggle = (id, label, on, offLabel, onLabel) => `<div class="set-toggle"><span>${label}</span><div class="seg2" role="group" aria-label="${esc(label)}"><button data-do="set-flag" data-flag="${id}" data-val="0" class="${on ? '' : 'on'}" aria-pressed="${!on}">${esc(offLabel)}</button><button data-do="set-flag" data-flag="${id}" data-val="1" class="${on ? 'on' : ''}" aria-pressed="${on}">${esc(onLabel)}</button></div></div>`;
  const discOptions = Object.entries(DISCIPLINES).map(([id, v]) => `<option value="${id}" ${d.discipline === id ? 'selected' : ''}>${esc(v.name)}</option>`).join('');
  const events = ACTION_CATALOG.map(a => `<label class="set-check"><input type="checkbox" data-do="set-event" data-code="${a.code}" ${d.enabled.includes(a.code) ? 'checked' : ''}><span>${esc(a.label)}</span><small>${a.code}</small></label>`).join('');
  showModal(`${head('Settings')}
    <p class="dialog-note">These apply to the next match you start. A match already in progress keeps the settings it began with.</p>
    <div class="set-group"><h3>Discipline</h3>
      <label class="set-num" style="grid-column:1/-1">Lacrosse discipline<select id="set-discipline" data-do="set-discipline">${discOptions}</select><small>Picking one fills the defaults below; you can still change any value.</small></label>
    </div>
    <div class="set-group"><h3>Periods &amp; time</h3>
      <div class="set-grid">
        ${num('set-quarters', 'Number of periods', d.quarters, 1, 6)}
        ${num('set-qmin', 'Minutes per period', d.quarterMinutes, 1, 60)}
        ${num('set-otmin', 'Minutes per OT period', d.otMinutes, 1, 30)}
        ${num('set-shot', 'Shot clock (seconds)', d.shotClockSeconds, 0, 120, '0 = no shot clock')}
      </div>
    </div>
    <div class="set-group"><h3>Clock</h3>
      ${toggle('countUp', 'Time direction', d.countUp, 'Count down', 'Count up')}
      ${toggle('autoClock', 'Timing', d.autoClock, 'Manual', 'Automatic')}
      <p class="dialog-note" style="margin-top:4px">Manual timing hides Start/Stop; you set the clock yourself with “Set time”.</p>
    </div>
    <div class="set-group"><h3>Events to collect</h3>
      <div class="set-events">${events}</div>
    </div>
    <div class="dialog-actions"><button class="primary" data-do="save-settings">Save settings</button><button class="secondary" data-do="close">Cancel</button></div>`);
}
function showArchives() {
  showModal(`${head('Match archive')}<div class="fields">${[...db.matches].reverse().map(m => `<button class="secondary archive-item" data-do="resume" data-id="${m.id}">${esc(m.teams.map(t => t.name).join(' — '))}<small>${new Date(m.date).toLocaleDateString('en-GB')} · ${m.events.length} actions</small></button>`).join('')}</div>`);
}

/* ---------- Exports ---------- */
const fileBase = () => `match_${match.teams.map(t => t.id).join('-')}_${match.date.slice(0, 10)}_${match.id.slice(0, 6)}`;
function showExportText(title, text) {
  showModal(`${head(title)}<p class="dialog-note">Copy the export and paste it into a file.</p><textarea class="export-text" id="export-text" readonly></textarea><div class="dialog-actions"><button class="primary" data-do="copy-export">Copy</button><button class="secondary" data-do="close">Back to match</button></div>`);
  $('#export-text').value = text;
}
const standalone = !window.claude;
async function nativeSave(filename, fileData, type, label) {
  const file = new File([fileData], filename, { type });
  try {
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return; }
  } catch (err) { if (err?.name === 'AbortError') return; }
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000); notify(`${label} export downloaded`);
}
const MIME = { PDF: 'application/pdf', CSV: 'text/csv', XML: 'application/xml' };
async function saveFile(filename, fileData, label, textFallback) {
  if (standalone) return nativeSave(filename, fileData, MIME[label], label);
  if (downloads) {
    try { await downloads.save({ filename, data: fileData }); notify(`${label} export saved`); return; }
    catch (err) { if (err?.code === 'declined') return; if (err?.code === 'rate_limited') { notify('A save is already waiting. Try again in a moment.'); return; } }
  }
  if (textFallback != null) showExportText(`${label} export`, textFallback);
  else notify(`${label} export is unavailable in this view. Use CSV instead.`);
}
const exportPdf = () => saveFile(fileBase() + '.pdf', new Blob([createMatchPdf(match)]), 'PDF', null);
const exportCsv = () => { const csv = csvFor(match); saveFile(fileBase() + '.csv', csv, 'CSV', csv.slice(1)); };
const xmlName = () => match.gameNo ? `${match.date.slice(0, 4)}-${data.code}-game-${String(match.gameNo).padStart(3, '0')}.xml` : fileBase() + '.xml';
const exportXml = () => standalone ? nativeSave(xmlName(), xmlFor(match), MIME.XML, 'XML') : showExportText('XML export', xmlFor(match));

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-do]'); if (!b || b.disabled) return;
  const act = b.dataset.do;
  switch (act) {
    case 'close': closeModal(); break;
    case 'home': if (!match) renderSetup(); break;
    case 'setup-field': setupField = b.dataset.field; renderSetup(); break;
    case 'field': match.field = b.dataset.field; persist(); renderMatch(); break;
    case 'clock-toggle': clock.running = !clock.running; clock.at = Date.now(); persist(); $('#clock-panel').innerHTML = clockPanel(); break;
    case 'clock-reset-game': clock.game = startGame(currentPeriod()); clock.shot = SHOT_MS(); clock.running = false; persist(); $('#clock-panel').innerHTML = clockPanel(); break;
    case 'clock-set-game': { const v = prompt('Game clock remaining (m:ss or seconds):', fmtGame(clock.game)); if (v != null) { const ms = parseGame(v); if (ms == null) notify('Enter a time like 6:30 or 390.'); else { clock.game = ms; clock.running = false; persist(); $('#clock-panel').innerHTML = clockPanel(); } } break; }
    case 'clock-set-shot': { const v = prompt('Shot clock remaining (seconds):', fmtShot(clock.shot)); if (v != null) { const n = Number(v); if (!Number.isFinite(n) || n < 0) notify('Enter a number of seconds.'); else { clock.shot = Math.round(n) * 1000; clock.at = Date.now(); persist(); $('#clock-panel').innerHTML = clockPanel(); } } break; }
    case 'clock-reset-shot': clock.shot = SHOT_MS(); clock.at = Date.now(); persist(); paintClock(); break;
    case 'color': {
      const i = Number(b.dataset.side), color = b.dataset.color;
      if (b.dataset.scope === 'setup') { setupColors[i] = color; renderSetup(); }
      else { match.teams[i].color = color; persist(); closeModal(); renderMatch(); }
      break;
    }
    case 'choose-color': { const i = Number(b.dataset.side), t = match.teams[i]; showModal(`${head('Jersey colour')}<p class="dialog-note">${esc(t.name)}</p>${swatches(teamPalette(t, i).id, i, 'match')}`); break; }
    case 'period': if (!draft) { match.currentPeriod = Number(b.dataset.period); if (!clock.running && clockEnded()) { clock.game = startGame(currentPeriod()); clock.shot = SHOT_MS(); } persist(); renderMatch(); } break;
    case 'add-ot': if (!draft) { match.currentPeriod = Math.min(maxPeriod(), periodsInPlay() + 1); clock.game = startGame(currentPeriod()); clock.shot = SHOT_MS(); clock.running = false; persist(); renderMatch(); } break;
    case 'start': {
      const [a, c] = setupPicks; if (!a || !c || a === c || !setupField) return;
      match = { id: crypto.randomUUID(), date: new Date().toISOString(), field: setupField, teams: [a, c].map((id, i) => ({ ...structuredClone(data.teams.find(t => t.id === id)), color: setupColors[i] })), goalies: { [a]: setupGoalies[0] || null, [c]: setupGoalies[1] || null }, currentPeriod: 1, events: [], undo: [], gameNo: /^\d+$/.test(setupGameNo.trim()) ? String(Number(setupGameNo.trim())) : null };
      match.goalieLog = match.teams.filter(t => match.goalies[t.id]).map(t => ({ teamId: t.id, player: match.goalies[t.id], period: 1, clock: null, at: match.date }));
      loadClock(); persist(); renderMatch(); break;
    }
    case 'archives': showArchives(); break;
    case 'settings': settingsDraft = { ...settings, enabled: [...settings.enabled] }; showSettings(); break;
    case 'set-flag': { readSettingNumbers(); settingsDraft[b.dataset.flag] = b.dataset.val === '1'; showSettings(); break; }
    case 'save-settings': {
      readSettingNumbers();
      if (!settingsDraft.enabled.length) { notify('Keep at least one event type.'); return; }
      settingsDraft.enabled = ACTION_CATALOG.filter(a => settingsDraft.enabled.includes(a.code)).map(a => a.code);
      settings = settingsDraft; settingsDraft = null; saveSettings();
      closeModal();
      if (!match) renderSetup(); else renderMatch();
      notify('Settings saved');
      break;
    }
    case 'resume': match = db.matches.find(m => m.id === b.dataset.id); draft = null; loadClock(); persist(); closeModal(); renderMatch(); break;
    case 'action': {
      if (!match.field) { notify('Choose Field 1 or Field 2 first.'); return; }
      const teamId = b.dataset.team, code = b.dataset.action;
      draft = { teamId, action: code, stage: 'player', player: null, period: currentPeriod(), clock: captureClock(), save: code === 'SS' ? saveForShot(match, teamId) : null };
      renderMatch(); break;
    }
    case 'number':
      if (draft.stage === 'assist-player') { draft.assist = b.dataset.number; finalize(); return; }
      draft.player = b.dataset.number;
      afterPlayer();
      break;
    case 'time-confirm': {
      const txt = ($('#draft-gametime')?.value || '').trim();
      const ms = parseGame(txt);
      if (ms == null) { notify('Enter a time like 6:30.'); return; }
      draft.timeText = fmtGame(ms);
      draft.clock = { ...draft.clock, gameTime: draft.timeText };
      commitDraft();
      break;
    }
    case 'assist-yes': draft.stage = 'assist-player'; renderMatch(); break;
    case 'assist-no': draft.assist = null; finalize(); break;
    case 'penalty-card': draft.card = b.dataset.card || null; renderMatch(); break;
    case 'penalty-confirm': {
      if (!draft.offense) { notify('Choose the offense.'); return; }
      const raw = ($('#draft-pentime')?.value || '').trim();
      if (raw) { const ms = parseGame(raw); if (ms == null) { notify('Penalty time looks like MM:SS, e.g. 1:00.'); return; } draft.penTime = fmtGame(ms); } else draft.penTime = '';
      finalize();
      break;
    }
    case 'cancel': draft = null; renderMatch(); break;
    case 'undo': undo(); break;
    case 'history': showHistory(); break;
    case 'edit': showEdit(b.dataset.id); break;
    case 'export': exportPdf(); break;
    case 'export-csv': exportCsv(); break;
    case 'export-xml': exportXml(); break;
    case 'copy-export': {
      const ta = $('#export-text'), fail = () => { ta.focus(); ta.select(); notify('Select and copy the text'); };
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(ta.value).then(() => notify('Copied'), fail); else fail();
      break;
    }
    case 'delete': match = applyChange(match, match.events.filter(x => x.id !== b.dataset.id)); persist(); closeModal(); renderMatch(); notify('Action deleted · tap Undo to restore it'); break;
    case 'change-goalie': showQuickGoalie(b.dataset.team); break;
    case 'save-quick-goalie': {
      const t = match.teams.find(t => t.id === b.dataset.team), number = $('#quick-goalie').value;
      setGoalie(t.id, number); persist(); closeModal(); renderMatch();
      notify(number ? `${t.name} · Goalkeeper #${number}` : `${t.name} · No active goalkeeper`); break;
    }
    case 'rosters': showRosters(); break;
    case 'save-goalie': {
      const teamId = $('#roster-team').value, goalie = $('#roster-goalie').value, t = team(teamId);
      setGoalie(teamId, goalie); persist(); closeModal(); renderMatch();
      notify(goalie ? `Goalkeeper #${goalie} set for ${t.name}` : `Active goalkeeper cleared for ${t.name}`); break;
    }
    case 'save-player': {
      const t = team($('#roster-team').value), n = $('#roster-number').value.trim(), name = $('#roster-name').value.trim();
      if (!/^\d{1,3}$/.test(n) || !name) { $('#roster-error').textContent = 'Enter a jersey number (0–999) and a player name.'; return; }
      const num = String(Number(n)), p = t.players.find(p => p.number === num);
      if (p) p.name = name; else t.players.push({ number: num, name });
      t.players.sort((x, y) => Number(x.number) - Number(y.number)); persist(); closeModal(); renderMatch(); notify('Roster saved'); break;
    }
    case 'new': showModal(`${head('Start a new match?')}<p class="dialog-note">This match stays saved in the Match archive. You can resume it and export it later.</p><div class="dialog-actions"><button class="primary" data-do="confirm-new">Set up another match</button><button class="secondary" data-do="close">Back</button></div>`); break;
    case 'confirm-new':
      clock.running = false; persist(); db.activeId = null; match = null; draft = null; persist(); closeModal();
      setupPicks = ['', '']; setupColors = ['blue', 'red']; setupGoalies = ['', '']; setupField = null; setupGameNo = '';
      $('#save-status').innerHTML = '<i></i> Ready'; renderSetup(); break;
  }
});
document.addEventListener('input', e => { if (e.target.id === 'game-no') setupGameNo = e.target.value; if (e.target.id === 'draft-gametime' && draft) draft.timeText = e.target.value; if (e.target.id === 'draft-pentime' && draft) draft.penTime = e.target.value; });
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'set-discipline') {
    readSettingNumbers();
    const preset = DISCIPLINES[e.target.value];
    if (preset) { settingsDraft = { ...settingsDraft, discipline: e.target.value, quarters: preset.quarters, quarterMinutes: preset.quarterMinutes, otMinutes: preset.otMinutes, shotClockSeconds: preset.shotClockSeconds, enabled: [...preset.enabled] }; showSettings(); }
    return;
  }
  if (e.target.dataset?.do === 'set-event') {
    readSettingNumbers();
    const code = e.target.dataset.code;
    if (e.target.checked) { if (!settingsDraft.enabled.includes(code)) settingsDraft.enabled.push(code); }
    else settingsDraft.enabled = settingsDraft.enabled.filter(c => c !== code);
    return;
  }
  if (id === 'draft-offense') { if (draft) draft.offense = e.target.value; const c = $('.confirm-penalty'); if (c) c.disabled = !e.target.value; return; }
  if (id.startsWith('pick-')) { const i = Number(id.at(-1)); setupPicks[i] = e.target.value; setupGoalies[i] = data.teams.find(t => t.id === e.target.value)?.goalie?.number || ''; renderSetup(); return; }
  if (['edit-team', 'edit-player', 'edit-action'].includes(id)) {
    const t = team($('#edit-team').value);
    if (id === 'edit-team') $('#edit-player').innerHTML = playerOptions(t);
    const old = $('#edit-assist').value;
    $('#edit-assist').innerHTML = '<option value="">No</option>' + playerOptions(t, old, $('#edit-player').value);
    $('#assist-field').hidden = $('#edit-action').value !== 'G';
    $('#save-field').hidden = $('#edit-action').value !== 'SS';
    $('#card-field').hidden = $('#offense-field').hidden = $('#pentime-field').hidden = $('#edit-action').value !== 'PEN';
    if (id === 'edit-team') $('#edit-save').innerHTML = saveOptions(t.id, match.goalies?.[match.teams.find(x => x.id !== t.id)?.id] ?? '');
  }
  if (id === 'roster-team') { const t = team(e.target.value); $('#roster-list').innerHTML = rosterList(t); $('#roster-goalie').innerHTML = goalieOptions(t, match.goalies?.[t.id] ?? ''); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'edit-form') return;
  e.preventDefault();
  const id = e.target.dataset.id, old = match.events.find(x => x.id === id), action = $('#edit-action').value, teamId = $('#edit-team').value;
  try {
    const updated = validateEvent({ ...old, teamId, action, period: $('#edit-period').value ? Number($('#edit-period').value) : null, player: $('#edit-player').value, assist: action === 'G' ? ($('#edit-assist').value || null) : null, save: action === 'SS' ? { teamId: match.teams.find(t => t.id !== teamId).id, player: $('#edit-save').value || null } : null, penalty: action === 'PEN' ? { offense: $('#edit-offense').value, card: $('#edit-card').value || null, time: ($('#edit-pentime').value || '').trim() ? fmtGame(parseGame($('#edit-pentime').value) ?? 0) : null } : null }, match.teams);
    match = applyChange(match, match.events.map(x => x.id === id ? updated : x)); draft = null; persist(); closeModal(); renderMatch(); notify('Action updated');
  } catch (err) { $('#edit-error').textContent = err.message; }
});
modal.addEventListener('click', e => { if (e.target === modal) { const r = modal.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeModal(); } });
modal.addEventListener('close', () => { modal.innerHTML = ''; });

/* ---------- Tablet: keep the screen awake, follow rotation ---------- */
let wakeLock = null;
async function keepAwake() { try { if (match && !wakeLock && document.visibilityState === 'visible' && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch { wakeLock = null; } }
document.addEventListener('click', keepAwake);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); if (clock.running) tick(); } else if (match) persist(); });
wide.addEventListener('change', () => { if (match && !modal.open) renderMatch(); });

/* ---------- Boot ---------- */
match = db.matches.find(m => m.id === db.activeId) || null;
if (match) { loadClock(); renderMatch(); $('#save-status').innerHTML = '<i></i> Saved on this device'; notify('Match restored'); }
else renderSetup();
if (!storageOkay) notify('Saving unavailable. Remember to export your match.');
if (window.claude?.use) window.claude.use('downloads').then(d => { downloads = d; }, () => {});
</script>
</body>
